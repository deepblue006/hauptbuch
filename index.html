<body>
<div class="buch">
  <header class="deckel">
    <div class="wortmarke">Finanz<span class="amp">&nbsp;·&nbsp;</span>Contor</div>
    <div class="untertitel">Hauptbuch des Hauses</div>
  </header>

  <main class="seite" id="seite"></main>
</div>

<button class="siegel" id="siegel" aria-label="Neuen Eintrag verbuchen">+</button>

<div class="streifen" id="streifen" role="region" aria-label="Beweggrund vermerken"></div>

<div class="schleier" id="schleier">
  <div class="zettel-dialog" id="zettel" role="dialog" aria-modal="true"></div>
</div>

<div class="quittung" id="quittung" role="status">Verbucht.</div>

<script>
'use strict';

/* ════════════════ Datenhaltung ════════════════ */

const SPEICHER_SCHLUESSEL = 'fc_data_v1';
const SCHEMA_VERSION = 2;
const EINNAHME_ID = 'k_einnahme'; // Sammelposten für Gutschriften ohne eigene Zuordnung
const ABHEBUNG_ID = 'k_bargeldabhebung'; // Pseudo-Posten: erhöht die Kasse, nie budgetwirksam

function startBeweggruende() {
  return [
    { id: 'g_geplant',      name: 'Geplanter Kauf',    geplantStandard: true,  aktiv: true, reihenfolge: 1 },
    { id: 'g_beduerfnis',   name: 'Bedürfnis',         geplantStandard: true,  aktiv: true, reihenfolge: 2 },
    { id: 'g_ersatz',       name: 'Ersatzbeschaffung', geplantStandard: true,  aktiv: true, reihenfolge: 3 },
    { id: 'g_geschenk',     name: 'Geschenk',          geplantStandard: true,  aktiv: true, reihenfolge: 4 },
    { id: 'g_impuls',       name: 'Impulskauf',        geplantStandard: false, aktiv: true, reihenfolge: 5 },
    { id: 'g_kompensation', name: 'Kompensationskauf', geplantStandard: false, aktiv: true, reihenfolge: 6 },
    { id: 'g_belohnung',    name: 'Belohnung',         geplantStandard: false, aktiv: true, reihenfolge: 7 },
    { id: 'g_sozial',       name: 'Sozialer Anlass',   geplantStandard: false, aktiv: true, reihenfolge: 8 },
    { id: 'g_bequem',       name: 'Bequemlichkeit',    geplantStandard: false, aktiv: true, reihenfolge: 9 }
  ];
}

function leererBestand() {
  return {
    schemaVersion: SCHEMA_VERSION,
    settings: {
      monatsstart: 1,
      statusSchwellen: { knapp: 0.85 },
      letzteSicherung: null,
      ort: 'Konstanz',
      importZuordnung: {},
      planung: { restbestand: null, korrektur: 0, korrekturGrund: '', stand: null }
    },
    kategorien: [],
    buchungen: [],
    regeln: [],
    beweggruende: startBeweggruende(),
    wunschgruppen: [],
    wuensche: [],
    bargeld: { bestand: 0, bewegungen: [] },
    kredite: []
  };
}

let daten = ladeDaten();

function ladeDaten() {
  try {
    const roh = localStorage.getItem(SPEICHER_SCHLUESSEL);
    if (!roh) return leererBestand();
    const d = JSON.parse(roh);
    if (!d || typeof d.schemaVersion !== 'number') return leererBestand();
    return migriere(d);
  } catch (e) {
    return leererBestand();
  }
}

function migriere(d) {
  // Additive Felder aus Schema 1 absichern.
  const basis = leererBestand();
  d.settings = Object.assign(basis.settings, d.settings || {});
  if (!d.settings.statusSchwellen || typeof d.settings.statusSchwellen.knapp !== 'number') {
    d.settings.statusSchwellen = Object.assign({ knapp: 0.85 }, d.settings.statusSchwellen || {});
  }
  if (!d.settings.importZuordnung || typeof d.settings.importZuordnung !== 'object') {
    d.settings.importZuordnung = {};
  }
  if (!d.settings.planung || typeof d.settings.planung !== 'object') {
    d.settings.planung = { restbestand: null, korrektur: 0, korrekturGrund: '', stand: null };
  }
  d.kategorien = (d.kategorien || []).map(k => Object.assign({ archiviert: false, reihenfolge: 0 }, k));
  d.buchungen = d.buchungen || [];
  d.regeln = d.regeln || [];
  d.bargeld = d.bargeld || basis.bargeld;
  d.kredite = d.kredite || [];

  // Migration Schema 1 -> 2 (Reflexionsebene). Idempotent.
  if (!Array.isArray(d.beweggruende) || d.beweggruende.length === 0) {
    d.beweggruende = startBeweggruende();
  }
  if (!Array.isArray(d.wunschgruppen)) d.wunschgruppen = [];
  if (!Array.isArray(d.wuensche)) d.wuensche = [];
  // Sammelposten nachziehen, falls Altbestand auf ihn verweist (v0.3/v0.4).
  if (d.buchungen.some(b => b.kategorieId === EINNAHME_ID) && !d.kategorien.some(k => k.id === EINNAHME_ID)) {
    d.kategorien.push({
      id: EINNAHME_ID, name: 'Einnahme (ohne Zuordnung)', typ: 'einnahme',
      konto: 'giro', monatsbudget: 0, reihenfolge: 0, archiviert: false
    });
  }
  // beweggrundId / geplant / wunschId bleiben an Bestandsbuchungen ungesetzt (null gleichwertig).
  d.schemaVersion = SCHEMA_VERSION;
  return d;
}

function speichere() {
  localStorage.setItem(SPEICHER_SCHLUESSEL, JSON.stringify(daten));
}

function neueId(praefix) {
  return praefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

/* ════════════════ Hilfen: Zahl & Datum ════════════════ */

const euroFormat = new Intl.NumberFormat('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function euro(n) { return euroFormat.format(n) + ' €'; }
function euroOhneZeichen(n) { return euroFormat.format(n); }

function parseBetrag(text) {
  if (typeof text !== 'string') return NaN;
  let t = text.trim().replace(/\s/g, '').replace(/€/g, '');
  t = t.replace(/[−–—]/g, '-').replace(/^\+/, '');
  if (!t) return NaN;
  t = t.replace(/\./g, '').replace(',', '.');
  const n = Number(t);
  return isFinite(n) ? n : NaN;
}

const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

function heuteISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function aktuellesBlatt() { return heuteISO().slice(0, 7); }
function blattName(blatt) {
  const [j, m] = blatt.split('-').map(Number);
  return MONATE[m - 1] + (j !== new Date().getFullYear() ? ' ' + j : '');
}
function blattNameLang(blatt) {
  const [j, m] = blatt.split('-').map(Number);
  return MONATE[m - 1] + ' ' + j;
}
function tageImMonat(blatt) {
  const [j, m] = blatt.split('-').map(Number);
  return new Date(j, m, 0).getDate();
}
function datumLang(iso) {
  const [j, m, t] = iso.split('-').map(Number);
  return t + '. ' + MONATE[m - 1] + ' ' + j;
}
function datumKurz(iso) {
  const [, m, t] = iso.split('-').map(Number);
  return t + '.' + String(m).padStart(2, '0') + '.';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ════════════════ Berechnungen ════════════════ */

function buchungenImBlatt(blatt) {
  return daten.buchungen.filter(b => b.datum.slice(0, 7) === blatt);
}

function istBetrag(kategorieId, blatt) {
  let summe = 0;
  for (const b of daten.buchungen) {
    if (b.kategorieId === kategorieId && b.datum.slice(0, 7) === blatt && b.betrag < 0) {
      summe += -b.betrag;
    }
  }
  for (const c of daten.bargeld.bewegungen) {
    if (c.kategorieId === kategorieId && c.datum.slice(0, 7) === blatt && c.betrag < 0) {
      summe += -c.betrag;
    }
  }
  return summe;
}

/* ── Bargeld ── */

function tageSeitLetzterSicherung() {
  const ls = daten.settings.letzteSicherung;
  if (!ls) return null;
  const dann = new Date(String(ls).slice(0, 10) + 'T00:00:00');
  const heute = new Date(heuteISO() + 'T00:00:00');
  if (isNaN(dann.getTime())) return null;
  return Math.max(0, Math.round((heute - dann) / 86400000));
}

function kassenBestand() {  let bestand = 0;
  for (const b of daten.buchungen) {
    if (b.kategorieId === ABHEBUNG_ID) bestand += Math.abs(b.betrag);
  }
  for (const c of daten.bargeld.bewegungen) {
    bestand += c.betrag;
  }
  return Math.round(bestand * 100) / 100;
}

function istAusgabePosten(k) {
  return k && k.typ !== 'einnahme' && k.id !== EINNAHME_ID && k.id !== ABHEBUNG_ID;
}
function istEinnahmePosten(k) {
  return k && (k.typ === 'einnahme' || k.id === EINNAHME_ID) && k.id !== ABHEBUNG_ID;
}
function ausgabePosten() {
  return daten.kategorien.filter(k => istAusgabePosten(k) && !k.archiviert)
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));
}
function einnahmePosten() {
  return daten.kategorien.filter(k => istEinnahmePosten(k) && !k.archiviert)
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));
}

function sichtbarePosten(blatt) {
  const aktiv = daten.kategorien.filter(k => !k.archiviert && istAusgabePosten(k));
  const archivierteMitEintraegen = daten.kategorien.filter(k =>
    k.archiviert && istAusgabePosten(k) && buchungenImBlatt(blatt).some(b => b.kategorieId === k.id)
  );
  return aktiv.concat(archivierteMitEintraegen)
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));
}

function blattZahlen(blatt) {
  const posten = sichtbarePosten(blatt);
  let soll = 0, ist = 0;
  for (const p of posten) {
    if (!p.archiviert) soll += p.monatsbudget || 0;
    ist += istBetrag(p.id, blatt);
  }
  return { soll, ist, verfuegbar: soll - ist };
}

function alleBlaetter() {
  const menge = new Set(daten.buchungen.map(b => b.datum.slice(0, 7)));
  menge.add(aktuellesBlatt());
  return Array.from(menge).sort().reverse();
}

/* ════════════════ Ansicht: Hauptbuch ════════════════ */

let angezeigtesBlatt = aktuellesBlatt();

function render() {
  const seite = document.getElementById('seite');
  const blatt = angezeigtesBlatt;
  const istAktuell = blatt === aktuellesBlatt();
  const posten = sichtbarePosten(blatt);
  const zahlen = blattZahlen(blatt);
  const heute = new Date();
  const tagHeute = heute.getDate();
  const tImM = tageImMonat(blatt);
  const restTage = tImM - tagHeute;
  const monatsquote = tagHeute / tImM;
  const schwelleKnapp = (daten.settings.statusSchwellen && daten.settings.statusSchwellen.knapp) || 0.85;

  let html = '';

  /* Datumszeile */
  html += '<div class="datumszeile">';
  html += '<span>' + escapeHtml(daten.settings.ort || '') + (daten.settings.ort ? ', den ' : 'Den ') + '<b>' + datumLang(heuteISO()) + '</b></span>';
  html += '<button type="button" onclick="oeffneBlattwahl()" aria-label="Frühere Blätter ansehen">Blatt <b>' + escapeHtml(blattName(blatt)) + '</b></button>';
  html += '</div>';

  /* Saldo-Kopf */
  const ueberzogenGesamt = zahlen.verfuegbar < 0;
  html += '<section class="saldo-kopf">';
  html += '<div class="zettel">' + (istAktuell ? 'Verfügbar diesen Monat' : 'Verblieben im ' + escapeHtml(blattNameLang(blatt))) + '</div>';
  const v = Math.abs(zahlen.verfuegbar);
  const vGanz = Math.trunc(v);
  const vNach = Math.round((v - vGanz) * 100);
  html += '<div class="saldo-betrag' + (ueberzogenGesamt ? ' ueberzogen' : '') + '">'
       + (ueberzogenGesamt ? '−' : '') + euroFormat.format(vGanz).replace(/,00$/, '')
       + '<small>,' + String(vNach).padStart(2, '0') + ' €</small></div>';
  if (istAktuell) {
    if (ueberzogenGesamt) {
      html += '<div class="frei rot">von ' + euro(zahlen.soll) + ' — überzogen um ' + euro(v) + '</div>';
    } else {
      html += '<div class="frei">von ' + euro(zahlen.soll) + ' — der Kasse ' + (restTage === 1 ? 'verbleibt 1 Tag' : 'verbleiben ' + restTage + ' Tage') + '</div>';
    }
  } else {
    html += '<div class="frei neutral">von ' + euro(zahlen.soll) + ' — Blatt geschlossen</div>';
  }
  html += '</section>';

  /* Postenliste */
  html += '<div class="buchtitel">Hauptbuch · Posten</div>';

  if (posten.length === 0) {
    html += '<p class="vermerk">Noch kein Posten angelegt.<br>Das Hauptbuch wartet auf seine erste Zeile.</p>';
    const korbLeer = korbListe().length;
    if (korbLeer > 0) {
      html += '<div class="aufgaben-vermerk"><button type="button" onclick="oeffneKorb()">'
           + (korbLeer === 1 ? 'Ein Eintrag wartet' : korbLeer + ' Einträge warten') + ' im Eingangskorb.</button></div>';
    }
    html += '<div class="fusszeile"><button type="button" onclick="oeffnePostenNeu()">Posten anlegen</button>'
         + '<span class="trenner">·</span><button type="button" onclick="oeffneEinlesen()">Einlesen</button>'
         + '<span class="trenner">·</span><button type="button" onclick="oeffneVerwaltung()">Verwaltung</button></div>';
    seite.innerHTML = html;
    document.getElementById('siegel').hidden = true;
    return;
  }

  html += '<div class="spaltenkopf"><span>Posten</span><span>Ist</span><span>Soll</span></div>';

  for (const p of posten) {
    const ist = istBetrag(p.id, blatt);
    const soll = p.monatsbudget || 0;
    const quote = soll > 0 ? ist / soll : (ist > 0 ? 2 : 0);
    const ueberzogen = quote > 1;
    const breite = Math.min(quote, 1) * 100;
    const rest = soll - ist;

    let restText;
    if (ueberzogen) {
      restText = 'Überzogen um ' + euro(ist - soll) + ' — Vermerk in roter Tinte';
    } else if (quote >= schwelleKnapp) {
      restText = 'Verbleiben ' + euro(rest) + ' — knapp';
    } else if (istAktuell && quote > monatsquote) {
      restText = 'Verbleiben ' + euro(rest) + ' — läuft schneller als das Blatt';
    } else if (quote <= monatsquote || !istAktuell) {
      restText = 'Verbleiben ' + euro(rest) + (istAktuell ? ' — im Rahmen' : '');
    } else {
      restText = 'Verbleiben ' + euro(rest);
    }

    html += '<button type="button" class="posten' + (ueberzogen ? ' ueberzogen' : '') + '" onclick="oeffnePostenDetail(\'' + p.id + '\')" aria-label="Posten ' + escapeHtml(p.name) + ' ansehen">';
    html += '<span class="name">' + escapeHtml(p.name) + (p.archiviert ? ' <em>— archiviert</em>' : '') + '</span>';
    html += '<span class="ist">' + euroOhneZeichen(ist) + '</span>';
    html += '<span class="soll">/ ' + euroFormat.format(soll).replace(/,00$/, '') + '</span>';
    html += '<div class="tintenlinie"><i style="--w:' + breite.toFixed(1) + '%"></i></div>';
    html += '<div class="rest">' + restText + '</div>';
    html += '</button>';
  }

  /* Abschluss */
  html += '<div class="abschluss"><span>Summe der Ausgaben</span><span class="betrag">' + euro(zahlen.ist) + '</span></div>';

  /* Kasse (nur wenn Bargeld im Spiel ist) */
  const kasse = kassenBestand();
  const kasseGenutzt = kasse !== 0 || daten.bargeld.bewegungen.length > 0
                       || daten.buchungen.some(b => b.kategorieId === ABHEBUNG_ID);
  if (kasseGenutzt) {
    html += '<div class="kassenzeile"><button type="button" onclick="oeffneKasse()">In der Kasse: <b>'
         + euro(kasse) + '</b></button></div>';
  }

  /* Vormerkungen — stiller Summenvermerk, nie budgetwirksam */
  const vorgemerkt = vorgemerktSumme();
  if (vorgemerkt > 0 && istAktuell) {
    html += '<div class="kassenzeile"><button type="button" onclick="oeffneVormerkbuch()">Vorgemerkt: <b>'
         + euro(vorgemerkt) + '</b></button></div>';
  }

  /* Vermerk */
  const blattBuchungen = buchungenImBlatt(blatt).concat(
    daten.bargeld.bewegungen.filter(c => c.datum.slice(0, 7) === blatt && c.kategorieId)
  );
  if (blattBuchungen.length === 0) {
    html += '<p class="vermerk">Ein neues Blatt. Noch kein Eintrag verzeichnet.</p>';
  } else if (!istAktuell) {
    html += '<p class="vermerk">Blatt geschlossen. Geprüft und für richtig befunden.</p>';
  } else {
    const heuteEintraege = blattBuchungen.filter(b => b.datum === heuteISO()).length;
    if (heuteEintraege === 0) {
      html += '<p class="vermerk">Geprüft und für richtig befunden — heute noch kein Eintrag.</p>';
    } else {
      html += '<p class="vermerk">Heute ' + (heuteEintraege === 1 ? 'ein Eintrag' : heuteEintraege + ' Einträge') + ' verbucht.</p>';
    }
  }

  /* Aufgaben-Vermerk (Eingangskorb) */
  const korbAnzahl = korbListe().length;
  if (korbAnzahl > 0 && istAktuell) {
    html += '<div class="aufgaben-vermerk"><button type="button" onclick="oeffneKorb()">'
         + (korbAnzahl === 1 ? 'Ein Eintrag wartet' : korbAnzahl + ' Einträge warten') + ' im Eingangskorb.</button></div>';
  }

  /* Sicherungs-Erinnerung (F7.3) — stiller Randvermerk, keine Mahnung */
  const tageSeitSicherung = tageSeitLetzterSicherung();
  if (istAktuell && tageSeitSicherung !== null && tageSeitSicherung >= 14) {
    html += '<div class="aufgaben-vermerk"><button type="button" onclick="oeffneSicherung()">'
         + (tageSeitSicherung === null ? '' : 'Die letzte Sicherung liegt ' + tageSeitSicherung + ' Tage zurück.')
         + '</button></div>';
  } else if (istAktuell && tageSeitSicherung === null && daten.buchungen.length >= 10) {
    html += '<div class="aufgaben-vermerk"><button type="button" onclick="oeffneSicherung()">Noch keine Sicherung verzeichnet.</button></div>';
  }

  /* Fußzeile */
  html += '<div class="fusszeile">';
  html += '<button type="button" onclick="oeffneEinlesen()">Einlesen</button>';
  html += '<span class="trenner">·</span>';
  html += '<button type="button" onclick="oeffneVerwaltung()">Verwaltung</button>';
  html += '</div>';

  seite.innerHTML = html;
  document.getElementById('siegel').hidden = !istAktuell;
}

/* ════════════════ Zettel (Dialoge) ════════════════ */

const schleier = document.getElementById('schleier');
const zettel = document.getElementById('zettel');

function oeffneZettel(html) {
  schliesseStreifen();
  zettel.innerHTML = html;
  schleier.classList.add('offen');
}
function schliesseZettel() {
  schleier.classList.remove('offen');
  zettel.innerHTML = '';
  vermerkEditorFuer = null;
}
schleier.addEventListener('click', e => { if (e.target === schleier) schliesseZettel(); });

function zeigeQuittung(text) {
  const q = document.getElementById('quittung');
  q.textContent = text;
  q.classList.add('sichtbar');
  setTimeout(() => q.classList.remove('sichtbar'), 1400);
}

/* ── Eintrag (Siegel) ── */

let eintragBar = false;

function oeffneEintrag() {
  const posten = ausgabePosten();
  if (posten.length === 0) { oeffnePostenNeu(); return; }

  const blatt = aktuellesBlatt();
  let html = '<div class="zettel-titel">Eintrag</div>';
  html += '<div class="feldgruppe"><label for="eintrag-betrag">Betrag in Euro</label>';
  html += '<input class="feld betrag" id="eintrag-betrag" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>';
  html += '<div class="feldgruppe"><label>Bezahlt</label><div class="wahl2">';
  html += '<button type="button" id="ez-konto" class="' + (eintragBar ? '' : 'gewaehlt') + '" onclick="waehleEintragsart(false)">vom Konto</button>';
  html += '<button type="button" id="ez-bar" class="' + (eintragBar ? 'gewaehlt' : '') + '" onclick="waehleEintragsart(true)">bar</button>';
  html += '</div>';
  if (eintragBar) {
    html += '<p class="hinweistext" style="margin:6px 0 0">In der Kasse: <b>' + euro(kassenBestand()) + '</b></p>';
  }
  html += '</div>';
  html += '<div class="feldgruppe" style="margin-bottom:6px"><label>Posten wählen — verbucht sofort</label></div>';
  html += '<div class="postenwahl">';
  for (const p of posten) {
    const rest = (p.monatsbudget || 0) - istBetrag(p.id, blatt);
    html += '<button type="button" class="wahl-posten" onclick="verbuche(\'' + p.id + '\')">'
         + '<span class="w-name">' + escapeHtml(p.name) + '</span>'
         + '<span class="w-rest' + (rest < 0 ? ' rot' : '') + '">' + (rest < 0 ? 'überzogen um ' + euro(-rest) : 'verbleiben ' + euro(rest)) + '</span>'
         + '</button>';
  }
  html += '</div>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="schliesseZettel()">Abbrechen</button></div>';
  oeffneZettel(html);
  const feld = document.getElementById('eintrag-betrag');
  feld.focus();
}

function waehleEintragsart(bar) {
  eintragBar = bar;
  const betrag = document.getElementById('eintrag-betrag').value;
  oeffneEintrag();
  document.getElementById('eintrag-betrag').value = betrag;
}

/* ── Beweggrund-Hilfen ── */

function aktiveBeweggruende() {
  return daten.beweggruende.filter(g => g.aktiv)
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0));
}
function beweggrund(id) {
  return daten.beweggruende.find(g => g.id === id) || null;
}
function vermerkText(b) {
  if (!b.beweggrundId) return null;
  const g = beweggrund(b.beweggrundId);
  const name = g ? g.name : 'Unbekannter Beweggrund';
  if (b.geplant === true) return name + ' — geplant';
  if (b.geplant === false) return name + ' — ungeplant';
  return name;
}

/* ── Vermerkstreifen (nach dem Verbuchen) ── */

let streifenTimer = null;

function zeigeVermerkstreifen(eintragId, istBar) {
  const s = document.getElementById('streifen');
  const bar = istBar ? 'true' : 'false';
  let html = '<div class="streifen-kopf"><span><b>Verbucht.</b> Ein Beweggrund? — freiwillig</span>'
           + '<button type="button" onclick="schliesseStreifen()">übergehen</button></div>';
  html += '<div class="streifen-reihe">';
  for (const g of aktiveBeweggruende()) {
    html += '<button type="button" class="stempel" onclick="vermerkeVomStreifen(\'' + eintragId + '\', \'' + g.id + '\', ' + bar + ')">' + escapeHtml(g.name) + '</button>';
  }
  html += '</div>';
  s.innerHTML = html;
  s.classList.add('sichtbar');
  if (streifenTimer) clearTimeout(streifenTimer);
  streifenTimer = setTimeout(schliesseStreifen, 8000);
}

function schliesseStreifen() {
  if (streifenTimer) { clearTimeout(streifenTimer); streifenTimer = null; }
  const s = document.getElementById('streifen');
  s.classList.remove('sichtbar');
}

function findeEintrag(id, istBar) {
  return istBar
    ? daten.bargeld.bewegungen.find(x => x.id === id)
    : daten.buchungen.find(x => x.id === id);
}

function vermerkeVomStreifen(eintragId, beweggrundId, istBar) {
  const b = findeEintrag(eintragId, istBar);
  const g = beweggrund(beweggrundId);
  if (b && g) {
    b.beweggrundId = g.id;
    b.geplant = g.geplantStandard;
    speichere();
  }
  schliesseStreifen();
  zeigeQuittung('Vermerkt.');
}

function verbuche(kategorieId) {
  const feld = document.getElementById('eintrag-betrag');
  const betrag = parseBetrag(feld.value);
  if (!(betrag > 0)) {
    feld.focus();
    feld.select && feld.select();
    return;
  }
  const kat = daten.kategorien.find(k => k.id === kategorieId);

  if (eintragBar) {
    const bewegung = {
      id: neueId('c'),
      datum: heuteISO(),
      betrag: -betrag,
      kategorieId: kategorieId,
      notiz: '',
      beweggrundId: null,
      geplant: null
    };
    daten.bargeld.bewegungen.push(bewegung);
    speichere();
    schliesseZettel();
    render();
    zeigeVermerkstreifen(bewegung.id, true);
    return;
  }

  const neueBuchung = {
    id: neueId('b'),
    datum: heuteISO(),
    betrag: -betrag,
    text: kat ? kat.name : '',
    konto: kat ? (kat.konto || 'haushalt') : 'haushalt',
    kategorieId: kategorieId,
    quelle: 'manuell',
    autoZugeordnet: false,
    beweggrundId: null,
    geplant: null,
    wunschId: null
  };
  daten.buchungen.push(neueBuchung);
  speichere();
  schliesseZettel();
  render();
  zeigeVermerkstreifen(neueBuchung.id);
}

/* ── Posten anlegen ── */

function oeffnePostenNeu() {
  let html = '<div class="zettel-titel">Neuer Posten</div>';
  html += '<div class="feldgruppe"><label for="pn-name">Bezeichnung</label>';
  html += '<input class="feld" id="pn-name" type="text" autocomplete="off" placeholder="z. B. Lebensmittel"></div>';
  html += '<div class="feldgruppe"><label for="pn-soll">Soll je Blatt (Euro)</label>';
  html += '<input class="feld" id="pn-soll" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="schliesseZettel()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="legePostenAn()">Anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('pn-name').focus();
}

function legePostenAn() {
  const name = document.getElementById('pn-name').value.trim();
  const soll = parseBetrag(document.getElementById('pn-soll').value);
  if (!name) { document.getElementById('pn-name').focus(); return; }
  if (!(soll >= 0)) { document.getElementById('pn-soll').focus(); return; }
  const maxReihe = daten.kategorien.reduce((m, k) => Math.max(m, k.reihenfolge || 0), 0);
  daten.kategorien.push({
    id: neueId('k'),
    name: name,
    typ: 'ausgabe',
    konto: 'haushalt',
    monatsbudget: soll,
    reihenfolge: maxReihe + 1,
    archiviert: false
  });
  speichere();
  schliesseZettel();
  render();
  zeigeQuittung('Posten angelegt.');
}

/* ── Posten-Detail (umbenennen, Soll, archivieren, Einträge) ── */

function oeffnePostenDetail(kategorieId) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  const blatt = angezeigtesBlatt;
  const istAktuell = blatt === aktuellesBlatt();
  const eintraege = buchungenImBlatt(blatt)
    .filter(b => b.kategorieId === kategorieId)
    .map(b => ({ e: b, bar: false }))
    .concat(daten.bargeld.bewegungen
      .filter(c => c.kategorieId === kategorieId && c.datum.slice(0, 7) === blatt)
      .map(c => ({ e: c, bar: true })))
    .sort((a, b) => b.e.datum.localeCompare(a.e.datum) || b.e.id.localeCompare(a.e.id));

  let html = '<div class="zettel-titel">Posten</div>';
  html += '<div class="feldgruppe"><label for="pd-name">Bezeichnung</label>';
  html += '<input class="feld" id="pd-name" type="text" autocomplete="off" value="' + escapeHtml(p.name) + '"></div>';
  html += '<div class="feldgruppe"><label for="pd-soll">Soll je Blatt (Euro)</label>';
  html += '<input class="feld" id="pd-soll" type="text" inputmode="decimal" autocomplete="off" value="' + euroOhneZeichen(p.monatsbudget || 0) + '"></div>';
  const pKonto = p.konto || 'haushalt';
  postenEditorKonto = pKonto;
  html += '<div class="feldgruppe"><label>Läuft über</label><div class="wahl2">';
  html += '<button type="button" id="pd-haushalt" class="' + (pKonto === 'haushalt' ? 'gewaehlt' : '') + '" onclick="waehlePostenKonto(\'haushalt\')">Haushaltskonto</button>';
  html += '<button type="button" id="pd-giro" class="' + (pKonto === 'giro' ? 'gewaehlt' : '') + '" onclick="waehlePostenKonto(\'giro\')">Girokonto</button>';
  html += '</div></div>';
  html += '<div class="knopfzeile" style="margin-top:4px;margin-bottom:8px">';
  if (p.archiviert) {
    html += '<button type="button" class="leise" onclick="archivierePosten(\'' + p.id + '\', false)">Wieder aufnehmen</button>';
  } else {
    html += '<button type="button" class="leise" id="pd-arch" onclick="archivierenBestaetigen(\'' + p.id + '\')">Posten archivieren</button>';
  }
  html += '<button type="button" class="knopf primaer" onclick="speicherePosten(\'' + p.id + '\')">Übernehmen</button>';
  html += '</div>';

  html += '<div class="buchtitel" style="margin-top:14px">Einträge · Blatt ' + escapeHtml(blattName(blatt)) + '</div>';
  if (eintraege.length === 0) {
    html += '<p class="hinweistext" style="text-align:center">Kein Eintrag auf diesem Blatt.</p>';
  } else {
    html += '<div class="eintragsliste">';
    for (const eintrag of eintraege) {
      const b = eintrag.e, bar = eintrag.bar;
      const barFlag = bar ? 'true' : 'false';
      html += '<div class="eintragszeile" id="ez-' + b.id + '">';
      html += '<span class="e-datum">' + datumKurz(b.datum) + '</span>';
      html += '<span class="e-betrag">' + euro(-b.betrag) + '</span>';
      if (istAktuell) {
        if (!bar) {
          html += '<button type="button" onclick="oeffneUmbuchen(\'' + b.id + '\', \'' + p.id + '\')">umbuchen</button>';
        }
        html += '<button type="button" onclick="streicheEintrag(\'' + b.id + '\', \'' + p.id + '\', this, ' + barFlag + ')">streichen</button>';
      }
      if (bar) {
        html += '<span class="e-auto">bar bezahlt</span>';
      } else if (b.autoZugeordnet) {
        html += '<span class="e-auto">automatisch zugeordnet</span>';
      }
      const vt = vermerkText(b);
      if (vermerkEditorFuer === b.id) {
        html += baueVermerkEditor(b, p.id, bar);
      } else if (vt) {
        html += '<button type="button" class="e-vermerk" onclick="oeffneVermerkEditor(\'' + b.id + '\', \'' + p.id + '\')">' + escapeHtml(vt) + '</button>';
      } else {
        html += '<button type="button" class="e-vermerk leer" onclick="oeffneVermerkEditor(\'' + b.id + '\', \'' + p.id + '\')">Vermerk setzen</button>';
      }
      html += '</div>';
    }
    html += '</div>';
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="schliesseZettel()">Schließen</button></div>';
  oeffneZettel(html);
}

/* ── Umbuchen (Eintrag auf anderen Posten verschieben) ── */

function oeffneUmbuchen(buchungId, herkunftId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  const posten = daten.kategorien.filter(k => istAusgabePosten(k) && !k.archiviert && k.id !== b.kategorieId)
    .sort((x, y) => (x.reihenfolge || 0) - (y.reihenfolge || 0) || x.name.localeCompare(y.name, 'de'));
  const blatt = b.datum.slice(0, 7);

  let html = '<div class="zettel-titel">Umbuchen</div>';
  html += '<div class="korb-karte">';
  html += '<div class="korb-kopf"><span class="k-datum">' + datumLang(b.datum) + '</span>';
  html += '<span class="k-betrag">' + euro(Math.abs(b.betrag)) + '</span></div>';
  if (b.text) html += '<div class="korb-zweck">' + escapeHtml(b.text.length > 140 ? b.text.slice(0, 140) + '…' : b.text) + '</div>';
  html += '</div>';
  html += '<p class="hinweistext">Jetzt verbucht auf <b>' + escapeHtml(postenName(b.kategorieId)) + '</b>. Neuen Posten wählen:</p>';
  html += '<div class="postenwahl">';
  for (const p of posten) {
    const rest = (p.monatsbudget || 0) - istBetrag(p.id, blatt);
    html += '<button type="button" class="wahl-posten" onclick="fuehreUmbuchungAus(\'' + b.id + '\', \'' + p.id + '\', \'' + herkunftId + '\')">'
         + '<span class="w-name">' + escapeHtml(p.name) + '</span>'
         + '<span class="w-rest' + (rest < 0 ? ' rot' : '') + '">' + (rest < 0 ? 'überzogen um ' + euro(-rest) : 'verbleiben ' + euro(rest)) + '</span></button>';
  }
  html += '</div>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffnePostenDetail(\'' + herkunftId + '\')">Abbrechen</button></div>';
  oeffneZettel(html);
}

function fuehreUmbuchungAus(buchungId, zielId, herkunftId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  b.kategorieId = zielId;
  b.autoZugeordnet = false;
  speichere();
  render();
  zeigeQuittung('Umgebucht.');
  oeffnePostenDetail(herkunftId);
}

/* ── Vermerk am Eintrag (nachträglich, F8.4) ── */

let vermerkEditorFuer = null;

function baueVermerkEditor(b, kategorieId, istBar) {
  const barFlag = istBar ? 'true' : 'false';
  let html = '<div class="vermerk-editor">';
  html += '<div class="streifen-reihe">';
  for (const g of aktiveBeweggruende()) {
    const gewaehlt = b.beweggrundId === g.id;
    html += '<button type="button" class="stempel' + (gewaehlt ? ' gewaehlt' : '') + '" onclick="setzeVermerk(\'' + b.id + '\', \'' + g.id + '\', \'' + kategorieId + '\', ' + barFlag + ')">' + escapeHtml(g.name) + '</button>';
  }
  html += '</div>';
  html += '<div class="editor-zeile">';
  if (b.beweggrundId) {
    const gp = b.geplant === true ? 'geplant' : (b.geplant === false ? 'ungeplant' : 'ohne Kennzeichen');
    html += '<button type="button" onclick="dreheGeplant(\'' + b.id + '\', \'' + kategorieId + '\', ' + barFlag + ')">' + gp + ' — umdrehen</button>';
    html += '<button type="button" onclick="entferneVermerk(\'' + b.id + '\', \'' + kategorieId + '\', ' + barFlag + ')">Vermerk entfernen</button>';
  }
  html += '<button type="button" onclick="schliesseVermerkEditor(\'' + kategorieId + '\')">fertig</button>';
  html += '</div></div>';
  return html;
}

function oeffneVermerkEditor(buchungId, kategorieId) {
  vermerkEditorFuer = buchungId;
  oeffnePostenDetail(kategorieId);
}

function schliesseVermerkEditor(kategorieId) {
  vermerkEditorFuer = null;
  oeffnePostenDetail(kategorieId);
}

function setzeVermerk(eintragId, beweggrundId, kategorieId, istBar) {
  const b = findeEintrag(eintragId, istBar);
  const g = beweggrund(beweggrundId);
  if (b && g && b.beweggrundId !== g.id) {
    b.beweggrundId = g.id;
    b.geplant = g.geplantStandard;
    speichere();
  }
  oeffnePostenDetail(kategorieId);
}

function dreheGeplant(eintragId, kategorieId, istBar) {
  const b = findeEintrag(eintragId, istBar);
  if (b) {
    b.geplant = b.geplant === true ? false : true;
    speichere();
  }
  oeffnePostenDetail(kategorieId);
}

function entferneVermerk(eintragId, kategorieId, istBar) {
  const b = findeEintrag(eintragId, istBar);
  if (b) {
    b.beweggrundId = null;
    b.geplant = null;
    speichere();
  }
  vermerkEditorFuer = null;
  oeffnePostenDetail(kategorieId);
}

let postenEditorKonto = 'haushalt';

function waehlePostenKonto(konto) {
  postenEditorKonto = konto;
  const h = document.getElementById('pd-haushalt'), g = document.getElementById('pd-giro');
  if (h && g) {
    h.classList.toggle('gewaehlt', konto === 'haushalt');
    g.classList.toggle('gewaehlt', konto === 'giro');
  }
}

function speicherePosten(kategorieId) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  const name = document.getElementById('pd-name').value.trim();
  const soll = parseBetrag(document.getElementById('pd-soll').value);
  if (!name) { document.getElementById('pd-name').focus(); return; }
  if (!(soll >= 0)) { document.getElementById('pd-soll').focus(); return; }
  p.name = name;
  p.monatsbudget = soll;
  p.konto = postenEditorKonto;
  speichere();
  schliesseZettel();
  render();
  zeigeQuittung('Verbucht.');
}

function archivierenBestaetigen(kategorieId) {
  const knopf = document.getElementById('pd-arch');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    archivierePosten(kategorieId, true);
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich archivieren? Nochmals tippen.';
    knopf.classList.add('rot');
  }
}

function archivierePosten(kategorieId, archivieren) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  p.archiviert = archivieren;
  speichere();
  schliesseZettel();
  render();
  zeigeQuittung(archivieren ? 'Posten archiviert.' : 'Posten wieder aufgenommen.');
}

function streicheEintrag(eintragId, kategorieId, knopf, istBar) {
  if (knopf.dataset.bereit !== '1') {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'wirklich streichen?';
    knopf.classList.add('bestaetigen');
    return;
  }
  if (istBar) {
    const i = daten.bargeld.bewegungen.findIndex(c => c.id === eintragId);
    if (i >= 0) daten.bargeld.bewegungen.splice(i, 1);
  } else {
    const i = daten.buchungen.findIndex(b => b.id === eintragId);
    if (i >= 0) daten.buchungen.splice(i, 1);
  }
  speichere();
  oeffnePostenDetail(kategorieId);
  render();
  zeigeQuittung('Eintrag gestrichen.');
}

/* ── Beweggründe verwalten ── */

function oeffneBeweggruende() {
  const aktive = aktiveBeweggruende();
  const inaktive = daten.beweggruende.filter(g => !g.aktiv)
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0));

  let html = '<div class="zettel-titel">Beweggründe</div>';
  html += '<p class="hinweistext">Beweggründe sind freiwillige Randvermerke an Einträgen. Sie werden nie gelöscht, nur außer Gebrauch gestellt — bestehende Vermerke bleiben lesbar.</p>';
  for (const g of aktive) {
    html += '<button type="button" class="bg-zeile" onclick="oeffneBeweggrundEditor(\'' + g.id + '\')">';
    html += '<span class="b-name">' + escapeHtml(g.name) + '</span>';
    html += '<span class="b-standard">' + (g.geplantStandard ? 'geplant' : 'ungeplant') + '</span>';
    html += '</button>';
  }
  if (inaktive.length > 0) {
    html += '<div class="buchtitel" style="margin-top:16px">Ausser Gebrauch</div>';
    for (const g of inaktive) {
      html += '<button type="button" class="bg-zeile inaktiv" onclick="oeffneBeweggrundEditor(\'' + g.id + '\')">';
      html += '<span class="b-name">' + escapeHtml(g.name) + '</span>';
      html += '<span class="b-standard">wieder aufnehmen?</span>';
      html += '</button>';
    }
  }
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="schliesseZettel()">Schließen</button>';
  html += '<button type="button" class="knopf" onclick="oeffneBeweggrundEditor(null)">Beweggrund ergänzen</button>';
  html += '</div>';
  oeffneZettel(html);
}

let editorGeplantStandard = true;

function oeffneBeweggrundEditor(beweggrundId) {
  const g = beweggrundId ? beweggrund(beweggrundId) : null;
  editorGeplantStandard = g ? g.geplantStandard : true;

  let html = '<div class="zettel-titel">' + (g ? 'Beweggrund' : 'Neuer Beweggrund') + '</div>';
  html += '<div class="feldgruppe"><label for="bg-name">Bezeichnung</label>';
  html += '<input class="feld" id="bg-name" type="text" autocomplete="off" value="' + (g ? escapeHtml(g.name) : '') + '" placeholder="z. B. Vorratskauf"></div>';
  html += '<div class="feldgruppe"><label>Gilt in der Regel als</label>';
  html += '<div class="wahl2" id="bg-wahl">';
  html += '<button type="button" id="bg-geplant" onclick="waehleGeplantStandard(true)">geplant</button>';
  html += '<button type="button" id="bg-ungeplant" onclick="waehleGeplantStandard(false)">ungeplant</button>';
  html += '</div></div>';
  html += '<div class="knopfzeile">';
  if (g && g.aktiv) {
    html += '<button type="button" class="leise" id="bg-deakt" onclick="deaktivierenBestaetigen(\'' + g.id + '\')">Ausser Gebrauch stellen</button>';
  } else if (g && !g.aktiv) {
    html += '<button type="button" class="leise" onclick="aktiviereBeweggrund(\'' + g.id + '\')">Wieder aufnehmen</button>';
  } else {
    html += '<button type="button" class="leise" onclick="oeffneBeweggruende()">Zurück</button>';
  }
  html += '<button type="button" class="knopf primaer" onclick="speichereBeweggrund(' + (g ? '\'' + g.id + '\'' : 'null') + ')">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  zeichneGeplantWahl();
  if (!g) document.getElementById('bg-name').focus();
}

function waehleGeplantStandard(wert) {
  editorGeplantStandard = wert;
  zeichneGeplantWahl();
}

function zeichneGeplantWahl() {
  const jg = document.getElementById('bg-geplant');
  const ng = document.getElementById('bg-ungeplant');
  if (!jg || !ng) return;
  jg.classList.toggle('gewaehlt', editorGeplantStandard === true);
  ng.classList.toggle('gewaehlt', editorGeplantStandard === false);
}

function speichereBeweggrund(beweggrundId) {
  const name = document.getElementById('bg-name').value.trim();
  if (!name) { document.getElementById('bg-name').focus(); return; }
  if (beweggrundId) {
    const g = beweggrund(beweggrundId);
    if (!g) return;
    g.name = name;
    g.geplantStandard = editorGeplantStandard;
  } else {
    const maxReihe = daten.beweggruende.reduce((m, g) => Math.max(m, g.reihenfolge || 0), 0);
    daten.beweggruende.push({
      id: neueId('g'),
      name: name,
      geplantStandard: editorGeplantStandard,
      aktiv: true,
      reihenfolge: maxReihe + 1
    });
  }
  speichere();
  oeffneBeweggruende();
  zeigeQuittung('Verbucht.');
}

function deaktivierenBestaetigen(beweggrundId) {
  const knopf = document.getElementById('bg-deakt');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    const g = beweggrund(beweggrundId);
    if (g) { g.aktiv = false; speichere(); }
    oeffneBeweggruende();
    zeigeQuittung('Ausser Gebrauch gestellt.');
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich? Nochmals tippen.';
    knopf.classList.add('rot');
  }
}

function aktiviereBeweggrund(beweggrundId) {
  const g = beweggrund(beweggrundId);
  if (g) { g.aktiv = true; speichere(); }
  oeffneBeweggruende();
  zeigeQuittung('Wieder aufgenommen.');
}

/* ── Regeln (automatische Zuordnung) ── */

function aktiveRegeln() {
  return daten.regeln.filter(r => r.aktiv);
}

function findeRegel(text) {
  const t = (text || '').toLowerCase();
  for (const r of aktiveRegeln()) {
    const muster = (r.muster || '').toLowerCase().trim();
    if (muster && t.includes(muster)) return r;
  }
  return null;
}

function musterVorschlag(text) {
  // Erstes aussagekräftiges Wort des Empfängerteils.
  const empf = (text || '').split(' · ')[0];
  const woerter = empf.split(/[\s,.\/]+/).filter(w => w.length >= 3 && !/^\d+$/.test(w));
  const uebergehen = ['visa', 'der', 'die', 'das', 'und', 'gmbh', 'ag', 'kg', 'ohg', 'mbh', 'europe', 'deutschland'];
  for (const w of woerter) {
    if (!uebergehen.includes(w.toLowerCase())) return w.toLowerCase();
  }
  return woerter.length ? woerter[0].toLowerCase() : '';
}

function postenName(kategorieId) {
  if (kategorieId === EINNAHME_ID) return 'Einnahme (ohne Zuordnung)';
  if (kategorieId === ABHEBUNG_ID) return 'Bargeldabhebung';
  if (!kategorieId) return 'Kassensturz';
  const k = daten.kategorien.find(x => x.id === kategorieId);
  return k ? k.name : 'Unbekannt';
}

function oeffneRegeln() {
  let html = '<div class="zettel-titel">Regeln</div>';
  html += '<p class="hinweistext">Eine Regel ordnet eingelesene Buchungen selbsttätig einem Posten zu, wenn der Buchungstext das Muster enthält. Geprüft wird in dieser Reihenfolge; der erste Treffer gilt. Ein Beweggrund wird nie automatisch vergeben.</p>';
  if (daten.regeln.length === 0) {
    html += '<p class="vermerk">Noch keine Regel verzeichnet.</p>';
  } else {
    for (const r of daten.regeln) {
      html += '<button type="button" class="bg-zeile' + (r.aktiv ? '' : ' inaktiv') + '" onclick="oeffneRegelEditor(\'' + r.id + '\')">';
      html += '<span class="b-name">' + escapeHtml(r.muster) + '</span>';
      html += '<span class="b-standard">' + (r.aktiv ? '→ ' + escapeHtml(postenName(r.kategorieId)) : 'ruht') + '</span>';
      html += '</button>';
    }
  }
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneRegelEditor(null)">Regel anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
}

let regelEditorPosten = null;

function oeffneRegelEditor(regelId, musterVorbelegt, postenVorbelegt) {
  const r = regelId ? daten.regeln.find(x => x.id === regelId) : null;
  regelEditorPosten = r ? r.kategorieId : (postenVorbelegt || null);

  let html = '<div class="zettel-titel">' + (r ? 'Regel' : 'Neue Regel') + '</div>';
  html += '<div class="feldgruppe"><label for="rg-muster">Wenn der Buchungstext enthält</label>';
  html += '<input class="feld" id="rg-muster" type="text" autocomplete="off" autocapitalize="none" value="'
       + escapeHtml(r ? r.muster : (musterVorbelegt || '')) + '" placeholder="z. B. edeka"></div>';
  html += '<div class="feldgruppe"><label>Dann verbuchen auf</label></div>';
  html += '<div class="postenwahl">';
  const posten = ausgabePosten();
  for (const p of posten) {
    html += '<button type="button" class="wahl-posten" onclick="waehleRegelPosten(\'' + p.id + '\')">'
         + '<span class="w-name">' + escapeHtml(p.name) + '</span>'
         + '<span class="w-rest">' + (regelEditorPosten === p.id ? 'gewählt' : '') + '</span></button>';
  }
  for (const p of einnahmePosten()) {
    html += '<button type="button" class="wahl-posten" onclick="waehleRegelPosten(\'' + p.id + '\')">'
         + '<span class="w-name">' + escapeHtml(p.name) + ' <em style="font-style:italic;font-size:0.8rem;color:var(--tinte-blass)">— Einnahme</em></span>'
         + '<span class="w-rest">' + (regelEditorPosten === p.id ? 'gewählt' : '') + '</span></button>';
  }
  html += '<button type="button" class="wahl-posten" onclick="waehleRegelPosten(\'' + ABHEBUNG_ID + '\')">'
       + '<span class="w-name">Bargeldabhebung <em style="font-style:italic;font-size:0.8rem;color:var(--tinte-blass)">— in die Kasse</em></span>'
       + '<span class="w-rest">' + (regelEditorPosten === ABHEBUNG_ID ? 'gewählt' : '') + '</span></button>';
  html += '</div>';
  html += '<div class="knopfzeile">';
  if (r) {
    html += '<button type="button" class="leise" id="rg-loeschen" onclick="regelLoeschenBestaetigen(\'' + r.id + '\')">Löschen</button>';
    html += '<button type="button" class="leise" onclick="regelUmschalten(\'' + r.id + '\')">' + (r.aktiv ? 'Ruhen lassen' : 'Wieder anwenden') + '</button>';
  } else {
    html += '<button type="button" class="leise" onclick="oeffneRegeln()">Zurück</button>';
  }
  html += '<button type="button" class="knopf primaer" onclick="speichereRegel(' + (r ? '\'' + r.id + '\'' : 'null') + ')">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  if (!r && !musterVorbelegt) document.getElementById('rg-muster').focus();
}

function waehleRegelPosten(kategorieId) {
  regelEditorPosten = kategorieId;
  zeichneRegelPostenwahl();
}

function zeichneRegelPostenwahl() {
  const knoepfe = zettel.querySelectorAll('.wahl-posten');
  knoepfe.forEach(k => {
    const treffer = (k.getAttribute('onclick') || '').match(/'([^']+)'/);
    const id = treffer ? treffer[1] : null;
    const rest = k.querySelector('.w-rest');
    if (rest) rest.textContent = (id === regelEditorPosten) ? 'gewählt' : '';
  });
}

function speichereRegel(regelId) {
  const muster = document.getElementById('rg-muster').value.trim();
  if (!muster) { document.getElementById('rg-muster').focus(); return; }
  if (!regelEditorPosten) { zeigeQuittung('Posten wählen.'); return; }
  if (regelId) {
    const r = daten.regeln.find(x => x.id === regelId);
    if (!r) return;
    r.muster = muster;
    r.kategorieId = regelEditorPosten;
  } else {
    daten.regeln.push({
      id: neueId('r'),
      muster: muster,
      feld: 'text',
      kategorieId: regelEditorPosten,
      aktiv: true
    });
  }
  speichere();
  oeffneRegeln();
  zeigeQuittung('Verbucht.');
}

function regelUmschalten(regelId) {
  const r = daten.regeln.find(x => x.id === regelId);
  if (r) { r.aktiv = !r.aktiv; speichere(); }
  oeffneRegeln();
}

function regelLoeschenBestaetigen(regelId) {
  const knopf = document.getElementById('rg-loeschen');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    const i = daten.regeln.findIndex(x => x.id === regelId);
    if (i >= 0) daten.regeln.splice(i, 1);
    speichere();
    oeffneRegeln();
    zeigeQuittung('Regel gelöscht.');
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich? Nochmals tippen.';
    knopf.classList.add('rot');
  }
}

function sichereSammelposten() {
  // Der Sammelposten entsteht nur, wenn er gebraucht wird (Altbestand oder neue Gutschrift).
  if (daten.kategorien.some(k => k.id === EINNAHME_ID)) return;
  daten.kategorien.push({
    id: EINNAHME_ID,
    name: 'Einnahme (ohne Zuordnung)',
    typ: 'einnahme',
    konto: 'giro',
    monatsbudget: 0,
    reihenfolge: 0,
    archiviert: false
  });
}

/* ── Einnahmen ── */

function einnahmenImBlatt(blatt) {
  return daten.buchungen.filter(b => b.datum.slice(0, 7) === blatt && b.betrag > 0 && b.kategorieId);
}

function einnahmeSumme(kategorieId, blatt) {
  let summe = 0;
  for (const b of daten.buchungen) {
    if (b.kategorieId === kategorieId && b.datum.slice(0, 7) === blatt && b.betrag > 0) summe += b.betrag;
  }
  return summe;
}

function oeffneEinnahmen(blatt) {
  const bl = blatt || angezeigtesBlatt;
  const posten = daten.kategorien.filter(k => istEinnahmePosten(k))
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));
  const mitEintraegen = posten.filter(p => einnahmeSumme(p.id, bl) > 0 || (!p.archiviert && p.id !== EINNAHME_ID));
  let gesamt = 0;
  for (const p of posten) gesamt += einnahmeSumme(p.id, bl);

  let html = '<div class="zettel-titel">Einnahmen · Blatt ' + escapeHtml(blattName(bl)) + '</div>';

  if (posten.length === 0) {
    html += '<p class="vermerk">Noch kein Einnahme-Posten angelegt.</p>';
  } else {
    html += '<div class="spaltenkopf"><span>Posten</span><span></span><span>Summe</span></div>';
    for (const p of mitEintraegen) {
      const summe = einnahmeSumme(p.id, bl);
      html += '<button type="button" class="einnahme-zeile" onclick="oeffneEinnahmeDetail(\'' + p.id + '\')">';
      html += '<span class="name">' + escapeHtml(p.name) + (p.archiviert ? ' <em>— archiviert</em>' : '') + '</span>';
      html += '<span class="e-summe">' + euroOhneZeichen(summe) + '</span>';
      html += '</button>';
    }
    html += '<div class="abschluss"><span>Summe der Einnahmen</span><span class="betrag">' + euro(gesamt) + '</span></div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneEinnahmePostenNeu()">Posten anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function oeffneEinnahmePostenNeu() {
  let html = '<div class="zettel-titel">Neuer Einnahme-Posten</div>';
  html += '<div class="feldgruppe"><label for="en-name">Bezeichnung</label>';
  html += '<input class="feld" id="en-name" type="text" autocomplete="off" placeholder="z. B. Gehalt"></div>';
  html += '<p class="hinweistext">Einnahmen zählen in kein Budget. Sie werden verzeichnet und hier summiert.</p>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneEinnahmen()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="legeEinnahmePostenAn()">Anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('en-name').focus();
}

function legeEinnahmePostenAn() {
  const name = document.getElementById('en-name').value.trim();
  if (!name) { document.getElementById('en-name').focus(); return; }
  const maxReihe = daten.kategorien.reduce((m, k) => Math.max(m, k.reihenfolge || 0), 0);
  daten.kategorien.push({
    id: neueId('k'),
    name: name,
    typ: 'einnahme',
    konto: 'giro',
    monatsbudget: 0,
    reihenfolge: maxReihe + 1,
    archiviert: false
  });
  speichere();
  oeffneEinnahmen();
  zeigeQuittung('Posten angelegt.');
}

function oeffneEinnahmeDetail(kategorieId) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  const bl = angezeigtesBlatt;
  const eintraege = daten.buchungen
    .filter(b => b.kategorieId === kategorieId && b.datum.slice(0, 7) === bl && b.betrag > 0)
    .sort((a, b) => b.datum.localeCompare(a.datum) || b.id.localeCompare(a.id));

  let html = '<div class="zettel-titel">Einnahme-Posten</div>';
  if (p.id === EINNAHME_ID) {
    html += '<p class="hinweistext"><b>' + escapeHtml(p.name) + '</b> — Sammelposten für Gutschriften ohne eigene Zuordnung. Einzelne Einträge lassen sich hier umbuchen.</p>';
  } else {
    html += '<div class="feldgruppe"><label for="ed-name">Bezeichnung</label>';
    html += '<input class="feld" id="ed-name" type="text" autocomplete="off" value="' + escapeHtml(p.name) + '"></div>';
    html += '<div class="knopfzeile" style="margin-top:4px;margin-bottom:8px">';
    if (p.archiviert) {
      html += '<button type="button" class="leise" onclick="archiviereEinnahmePosten(\'' + p.id + '\', false)">Wieder aufnehmen</button>';
    } else {
      html += '<button type="button" class="leise" id="ed-arch" onclick="einnahmeArchivierenBestaetigen(\'' + p.id + '\')">Posten archivieren</button>';
    }
    html += '<button type="button" class="knopf primaer" onclick="speichereEinnahmePosten(\'' + p.id + '\')">Übernehmen</button>';
    html += '</div>';
  }

  html += '<div class="buchtitel" style="margin-top:14px">Einträge · Blatt ' + escapeHtml(blattName(bl)) + '</div>';
  if (eintraege.length === 0) {
    html += '<p class="hinweistext" style="text-align:center">Kein Eintrag auf diesem Blatt.</p>';
  } else {
    html += '<div class="eintragsliste">';
    for (const b of eintraege) {
      html += '<div class="eintragszeile">';
      html += '<span class="e-datum">' + datumKurz(b.datum) + '</span>';
      html += '<span class="e-betrag">' + euro(b.betrag) + '</span>';
      html += '<button type="button" onclick="oeffneEinnahmeUmbuchen(\'' + b.id + '\', \'' + p.id + '\')">umbuchen</button>';
      if (b.text) html += '<span class="e-auto">' + escapeHtml(b.text.length > 90 ? b.text.slice(0, 90) + '…' : b.text) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneEinnahmen()">Zurück</button></div>';
  oeffneZettel(html);
}

function speichereEinnahmePosten(kategorieId) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  const name = document.getElementById('ed-name').value.trim();
  if (!name) { document.getElementById('ed-name').focus(); return; }
  p.name = name;
  speichere();
  oeffneEinnahmen();
  zeigeQuittung('Verbucht.');
}

function einnahmeArchivierenBestaetigen(kategorieId) {
  const knopf = document.getElementById('ed-arch');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    archiviereEinnahmePosten(kategorieId, true);
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich archivieren? Nochmals tippen.';
    knopf.classList.add('rot');
  }
}

function archiviereEinnahmePosten(kategorieId, archivieren) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  p.archiviert = archivieren;
  speichere();
  oeffneEinnahmen();
  zeigeQuittung(archivieren ? 'Posten archiviert.' : 'Posten wieder aufgenommen.');
}

function oeffneEinnahmeUmbuchen(buchungId, herkunftId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  const posten = daten.kategorien.filter(k => istEinnahmePosten(k) && !k.archiviert && k.id !== b.kategorieId)
    .sort((x, y) => (x.reihenfolge || 0) - (y.reihenfolge || 0) || x.name.localeCompare(y.name, 'de'));

  let html = '<div class="zettel-titel">Umbuchen</div>';
  html += '<div class="korb-karte">';
  html += '<div class="korb-kopf"><span class="k-datum">' + datumLang(b.datum) + '</span>';
  html += '<span class="k-betrag haben">+' + euro(b.betrag) + '</span></div>';
  if (b.text) html += '<div class="korb-zweck">' + escapeHtml(b.text.length > 140 ? b.text.slice(0, 140) + '…' : b.text) + '</div>';
  html += '</div>';
  html += '<p class="hinweistext">Jetzt verbucht auf <b>' + escapeHtml(postenName(b.kategorieId)) + '</b>. Neuen Posten wählen:</p>';
  if (posten.length === 0) {
    html += '<p class="hinweistext" style="text-align:center">Kein weiterer Einnahme-Posten vorhanden.</p>';
  } else {
    html += '<div class="postenwahl">';
    for (const p of posten) {
      html += '<button type="button" class="wahl-posten" onclick="fuehreEinnahmeUmbuchungAus(\'' + b.id + '\', \'' + p.id + '\', \'' + herkunftId + '\')">'
           + '<span class="w-name">' + escapeHtml(p.name) + '</span><span class="w-rest"></span></button>';
    }
    html += '</div>';
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneEinnahmeDetail(\'' + herkunftId + '\')">Abbrechen</button></div>';
  oeffneZettel(html);
}

function fuehreEinnahmeUmbuchungAus(buchungId, zielId, herkunftId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  b.kategorieId = zielId;
  b.autoZugeordnet = false;
  speichere();
  zeigeQuittung('Umgebucht.');
  oeffneEinnahmeDetail(herkunftId);
}

/* ── Kasse (Bargeldbestand) ── */

function oeffneKasse() {
  const bestand = kassenBestand();
  const abhebungen = daten.buchungen.filter(b => b.kategorieId === ABHEBUNG_ID)
    .map(b => ({ datum: b.datum, betrag: Math.abs(b.betrag), art: 'Abhebung', id: b.id, bar: false }));
  const ausgaben = daten.bargeld.bewegungen
    .map(c => ({ datum: c.datum, betrag: c.betrag, art: c.kategorieId === null ? 'Kassensturz' : postenName(c.kategorieId), id: c.id, bar: true }));
  const alle = abhebungen.concat(ausgaben)
    .sort((a, b) => b.datum.localeCompare(a.datum) || b.id.localeCompare(a.id))
    .slice(0, 40);

  let html = '<div class="zettel-titel">Kasse</div>';
  html += '<section class="saldo-kopf" style="padding-top:0">';
  html += '<div class="zettel">In der Kasse</div>';
  html += '<div class="saldo-betrag' + (bestand < 0 ? ' ueberzogen' : '') + '">' + euro(bestand) + '</div>';
  html += '</section>';

  html += '<div class="buchtitel" style="margin-top:16px">Bewegungen</div>';
  if (alle.length === 0) {
    html += '<p class="vermerk">Noch keine Bewegung verzeichnet.</p>';
    html += '<p class="hinweistext">Abhebungen erkennt die App über eine Regel auf den Posten „Bargeldabhebung". Barausgaben werden im Eintrag über „bar" erfasst.</p>';
  } else {
    html += '<div class="eintragsliste">';
    for (const z of alle) {
      html += '<div class="eintragszeile">';
      html += '<span class="e-datum">' + datumKurz(z.datum) + '</span>';
      html += '<span class="e-betrag' + (z.betrag > 0 ? ' haben' : '') + '">' + (z.betrag > 0 ? '+' : '−') + euro(Math.abs(z.betrag)) + '</span>';
      html += '<span class="e-auto">' + escapeHtml(z.art) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="schliesseZettel()">Schließen</button>';
  html += '<button type="button" class="knopf" onclick="oeffneKassensturz()">Kasse zählen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function oeffneKassensturz() {
  const bestand = kassenBestand();
  let html = '<div class="zettel-titel">Kasse zählen</div>';
  html += '<p class="hinweistext">Verzeichnet sind <b>' + euro(bestand) + '</b>. Den tatsächlich gezählten Betrag eintragen — die Differenz wird als Ausgleich verzeichnet, ohne Budgetwirkung.</p>';
  html += '<div class="feldgruppe"><label for="ks-betrag">Gezählt</label>';
  html += '<input class="feld betrag" id="ks-betrag" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneKasse()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="fuehreKassensturzAus()">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('ks-betrag').focus();
}

function fuehreKassensturzAus() {
  const feld = document.getElementById('ks-betrag');
  const gezaehlt = parseBetrag(feld.value);
  if (!isFinite(gezaehlt) || gezaehlt < 0) { feld.focus(); return; }
  const bestand = kassenBestand();
  const differenz = Math.round((gezaehlt - bestand) * 100) / 100;
  if (differenz === 0) {
    oeffneKasse();
    zeigeQuittung('Kasse stimmt.');
    return;
  }
  daten.bargeld.bewegungen.push({
    id: neueId('c'),
    datum: heuteISO(),
    betrag: differenz,
    kategorieId: null,   // ohne Posten = nie budgetwirksam
    notiz: 'Kassensturz',
    beweggrundId: null,
    geplant: null
  });
  speichere();
  render();
  oeffneKasse();
  zeigeQuittung('Kasse berichtigt.');
}

/* ── Vormerkbuch ── */

const GEPLANTER_KAUF_ID = 'g_geplant';

function offeneWuensche() {
  return daten.wuensche.filter(w => w.status === 'offen');
}

function vorgemerktSumme() {
  let summe = 0;
  for (const w of offeneWuensche()) summe += (w.betrag || 0);
  return summe;
}

function wunschgruppe(id) {
  return daten.wunschgruppen.find(g => g.id === id) || null;
}

function oeffneVormerkbuch() {
  const offen = offeneWuensche();
  const gruppen = daten.wunschgruppen.slice()
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));

  let html = '<div class="zettel-titel">Vormerkbuch</div>';

  if (offen.length === 0 && gruppen.length === 0) {
    html += '<p class="vermerk">Noch nichts vorgemerkt.</p>';
    html += '<p class="hinweistext">Vormerkungen sind Anschaffungen, die noch bevorstehen. Sie zählen in kein Budget, solange sie nicht eingelöst sind.</p>';
  } else {
    const ohneGruppe = offen.filter(w => !w.gruppeId || !wunschgruppe(w.gruppeId));
    for (const g of gruppen) {
      const inGruppe = offen.filter(w => w.gruppeId === g.id);
      html += '<div class="buchtitel" style="margin-top:16px">' + escapeHtml(g.name) + '</div>';
      if (inGruppe.length === 0) {
        html += '<p class="hinweistext" style="text-align:center;margin:6px 0">Keine offene Vormerkung.</p>';
      } else {
        html += baueWunschliste(inGruppe);
      }
    }
    if (ohneGruppe.length > 0) {
      html += '<div class="buchtitel" style="margin-top:16px">Ohne Gruppe</div>';
      html += baueWunschliste(ohneGruppe);
    }
    const summe = vorgemerktSumme();
    if (summe > 0) {
      html += '<div class="abschluss"><span>Vorgemerkt</span><span class="betrag">' + euro(summe) + '</span></div>';
      html += '<p class="vermerk">Nicht budgetwirksam — erst beim Einlösen.</p>';
    }
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneWunschEditor(null)">Vormerken</button>';
  html += '</div>';
  html += '<div class="korb-fuss">';
  html += '<button type="button" onclick="oeffneWunschgruppen()">Gruppen ordnen</button>';
  html += '<span class="trenner"> · </span>';
  html += '<button type="button" onclick="oeffneWunschArchiv()">Erledigtes</button>';
  html += '</div>';
  oeffneZettel(html);
}

function baueWunschliste(liste) {
  let html = '';
  for (const w of liste) {
    html += '<button type="button" class="wunsch-zeile" onclick="oeffneWunschDetail(\'' + w.id + '\')">';
    html += '<span class="w-titel">' + escapeHtml(w.titel) + '</span>';
    html += '<span class="w-betrag">' + (w.betrag ? euroOhneZeichen(w.betrag) : '—') + '</span>';
    if (w.postenId) {
      html += '<span class="w-ziel">für ' + escapeHtml(postenName(w.postenId)) + '</span>';
    }
    if (w.notiz) {
      html += '<span class="w-notiz">' + escapeHtml(w.notiz.length > 80 ? w.notiz.slice(0, 80) + '…' : w.notiz) + '</span>';
    }
    html += '</button>';
  }
  return html;
}

let wunschEditorGruppe = null;
let wunschEditorPosten = null;

function oeffneWunschEditor(wunschId) {
  const w = wunschId ? daten.wuensche.find(x => x.id === wunschId) : null;
  wunschEditorGruppe = w ? w.gruppeId : (daten.wunschgruppen.length === 1 ? daten.wunschgruppen[0].id : null);
  wunschEditorPosten = w ? w.postenId : null;

  let html = '<div class="zettel-titel">' + (w ? 'Vormerkung' : 'Neue Vormerkung') + '</div>';
  html += '<div class="feldgruppe"><label for="wu-titel">Was</label>';
  html += '<input class="feld" id="wu-titel" type="text" autocomplete="off" value="' + (w ? escapeHtml(w.titel) : '') + '" placeholder="z. B. Fahrradhelm"></div>';
  html += '<div class="feldgruppe"><label for="wu-betrag">Geschätzter Betrag — freiwillig</label>';
  html += '<input class="feld" id="wu-betrag" type="text" inputmode="decimal" autocomplete="off" value="' + (w && w.betrag ? euroOhneZeichen(w.betrag) : '') + '" placeholder="0,00"></div>';

  html += '<div class="feldgruppe"><label>Gruppe — freiwillig</label><div class="streifen-reihe">';
  for (const g of daten.wunschgruppen.sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0))) {
    html += '<button type="button" class="stempel' + (wunschEditorGruppe === g.id ? ' gewaehlt' : '') + '" onclick="waehleWunschGruppe(\'' + g.id + '\')">' + escapeHtml(g.name) + '</button>';
  }
  html += '<button type="button" class="stempel" onclick="oeffneWunschgruppeNeu()">+ Gruppe</button>';
  html += '</div></div>';

  html += '<div class="feldgruppe"><label>Ziel-Posten — freiwillig</label><div class="streifen-reihe">';
  for (const p of ausgabePosten()) {
    html += '<button type="button" class="stempel' + (wunschEditorPosten === p.id ? ' gewaehlt' : '') + '" onclick="waehleWunschPosten(\'' + p.id + '\')">' + escapeHtml(p.name) + '</button>';
  }
  html += '</div></div>';

  html += '<div class="feldgruppe"><label for="wu-notiz">Notiz — freiwillig</label>';
  html += '<input class="feld" id="wu-notiz" type="text" autocomplete="off" value="' + (w && w.notiz ? escapeHtml(w.notiz) : '') + '" placeholder=""></div>';

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="' + (w ? 'oeffneWunschDetail(\'' + w.id + '\')' : 'oeffneVormerkbuch()') + '">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="speichereWunsch(' + (w ? '\'' + w.id + '\'' : 'null') + ')">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  if (!w) document.getElementById('wu-titel').focus();
}

function waehleWunschGruppe(gruppeId) {
  wunschEditorGruppe = wunschEditorGruppe === gruppeId ? null : gruppeId;
  zeichneWunschWahl();
}

function waehleWunschPosten(postenId) {
  wunschEditorPosten = wunschEditorPosten === postenId ? null : postenId;
  zeichneWunschWahl();
}

function zeichneWunschWahl() {
  const reihen = zettel.querySelectorAll('.streifen-reihe');
  reihen.forEach(reihe => {
    reihe.querySelectorAll('.stempel').forEach(k => {
      const treffer = (k.getAttribute('onclick') || '').match(/'([^']+)'/);
      const id = treffer ? treffer[1] : null;
      const istGruppe = (k.getAttribute('onclick') || '').includes('waehleWunschGruppe');
      const istPosten = (k.getAttribute('onclick') || '').includes('waehleWunschPosten');
      if (istGruppe) k.classList.toggle('gewaehlt', id === wunschEditorGruppe);
      if (istPosten) k.classList.toggle('gewaehlt', id === wunschEditorPosten);
    });
  });
}

function speichereWunsch(wunschId) {
  const titel = document.getElementById('wu-titel').value.trim();
  if (!titel) { document.getElementById('wu-titel').focus(); return; }
  const betragRoh = document.getElementById('wu-betrag').value.trim();
  const betrag = betragRoh ? parseBetrag(betragRoh) : null;
  if (betragRoh && !(betrag >= 0)) { document.getElementById('wu-betrag').focus(); return; }
  const notiz = document.getElementById('wu-notiz').value.trim();

  if (wunschId) {
    const w = daten.wuensche.find(x => x.id === wunschId);
    if (!w) return;
    w.titel = titel;
    w.betrag = betrag;
    w.gruppeId = wunschEditorGruppe;
    w.postenId = wunschEditorPosten;
    w.notiz = notiz;
  } else {
    daten.wuensche.push({
      id: neueId('w'),
      titel: titel,
      gruppeId: wunschEditorGruppe,
      betrag: betrag,
      postenId: wunschEditorPosten,
      notiz: notiz,
      erstellt: heuteISO(),
      status: 'offen',
      buchungId: null
    });
  }
  speichere();
  render();
  oeffneVormerkbuch();
  zeigeQuittung('Vorgemerkt.');
}

function oeffneWunschDetail(wunschId) {
  const w = daten.wuensche.find(x => x.id === wunschId);
  if (!w) return;

  let html = '<div class="zettel-titel">Vormerkung</div>';
  html += '<div class="korb-karte">';
  html += '<div class="korb-kopf"><span class="k-datum">vorgemerkt am ' + datumLang(w.erstellt) + '</span>';
  if (w.betrag) html += '<span class="k-betrag">' + euro(w.betrag) + '</span>';
  html += '</div>';
  html += '<div class="korb-empf">' + escapeHtml(w.titel) + '</div>';
  const zusatz = [];
  if (w.gruppeId && wunschgruppe(w.gruppeId)) zusatz.push(wunschgruppe(w.gruppeId).name);
  if (w.postenId) zusatz.push('für ' + postenName(w.postenId));
  if (zusatz.length) html += '<div class="korb-zweck">' + escapeHtml(zusatz.join(' · ')) + '</div>';
  if (w.notiz) html += '<div class="korb-zweck">' + escapeHtml(w.notiz) + '</div>';
  html += '</div>';

  if (w.status === 'offen') {
    html += '<div class="knopfzeile" style="justify-content:center;margin-top:14px">';
    html += '<button type="button" class="knopf primaer" onclick="oeffneEinloesen(\'' + w.id + '\')">Einlösen</button>';
    html += '</div>';
    html += '<div class="knopfzeile">';
    html += '<button type="button" class="leise" onclick="oeffneWunschEditor(\'' + w.id + '\')">Ändern</button>';
    html += '<button type="button" class="leise rot" id="wu-verwerfen" onclick="verwerfenBestaetigen(\'' + w.id + '\')">Verwerfen</button>';
    html += '</div>';
  } else {
    html += '<p class="hinweistext" style="text-align:center;margin-top:14px">Status: <b>' + escapeHtml(w.status) + '</b>' + (w.status === 'verworfen' ? ' — wieder aufnehmbar' : '') + '.</p>';
    if (w.status === 'verworfen') {
      html += '<div class="knopfzeile" style="justify-content:center"><button type="button" class="knopf" onclick="wunschWiederAufnehmen(\'' + w.id + '\')">Wieder aufnehmen</button></div>';
    }
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneVormerkbuch()">Zurück</button></div>';
  oeffneZettel(html);
}

function verwerfenBestaetigen(wunschId) {
  const knopf = document.getElementById('wu-verwerfen');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    const w = daten.wuensche.find(x => x.id === wunschId);
    if (w) { w.status = 'verworfen'; speichere(); }
    render();
    oeffneVormerkbuch();
    zeigeQuittung('Verworfen.');
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich? Nochmals tippen.';
  }
}

function wunschWiederAufnehmen(wunschId) {
  const w = daten.wuensche.find(x => x.id === wunschId);
  if (w && w.status === 'verworfen') { w.status = 'offen'; w.buchungId = null; speichere(); }
  render();
  oeffneVormerkbuch();
  zeigeQuittung('Wieder aufgenommen.');
}

/* Einlösen: höchstens zwei Tipps bis zur Buchung */

let einloesenBar = false;

function oeffneEinloesen(wunschId) {
  const w = daten.wuensche.find(x => x.id === wunschId);
  if (!w) return;
  const posten = ausgabePosten();
  if (posten.length === 0) { zeigeQuittung('Erst einen Posten anlegen.'); return; }
  const blatt = aktuellesBlatt();

  let html = '<div class="zettel-titel">Einlösen</div>';
  html += '<p class="hinweistext" style="text-align:center"><b>' + escapeHtml(w.titel) + '</b></p>';
  html += '<div class="feldgruppe"><label for="el-betrag">Betrag in Euro</label>';
  html += '<input class="feld betrag" id="el-betrag" type="text" inputmode="decimal" autocomplete="off" value="'
       + (w.betrag ? euroOhneZeichen(w.betrag) : '') + '" placeholder="0,00"></div>';
  html += '<div class="feldgruppe"><label>Bezahlt</label><div class="wahl2">';
  html += '<button type="button" class="' + (einloesenBar ? '' : 'gewaehlt') + '" onclick="waehleEinloesenArt(\'' + w.id + '\', false)">vom Konto</button>';
  html += '<button type="button" class="' + (einloesenBar ? 'gewaehlt' : '') + '" onclick="waehleEinloesenArt(\'' + w.id + '\', true)">bar</button>';
  html += '</div></div>';
  html += '<p class="hinweistext">Der Beweggrund wird auf „Geplanter Kauf" gesetzt.</p>';
  html += '<div class="feldgruppe" style="margin-bottom:6px"><label>Posten wählen — verbucht sofort</label></div>';
  html += '<div class="postenwahl">';
  const sortiert = w.postenId
    ? posten.slice().sort((a, b) => (a.id === w.postenId ? -1 : 0) - (b.id === w.postenId ? -1 : 0))
    : posten;
  for (const p of sortiert) {
    const rest = (p.monatsbudget || 0) - istBetrag(p.id, blatt);
    html += '<button type="button" class="wahl-posten" onclick="loeseWunschEin(\'' + w.id + '\', \'' + p.id + '\')">'

         + '<span class="w-rest' + (rest < 0 ? ' rot' : '') + '">' + (rest < 0 ? 'überzogen um ' + euro(-rest) : 'verbleiben ' + euro(rest)) + '</span></button>';
  }
  html += '</div>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneWunschDetail(\'' + w.id + '\')">Abbrechen</button></div>';
  oeffneZettel(html);
}

function waehleEinloesenArt(wunschId, bar) {
  einloesenBar = bar;
  const betrag = document.getElementById('el-betrag').value;
  oeffneEinloesen(wunschId);
  document.getElementById('el-betrag').value = betrag;
}

function loeseWunschEin(wunschId, kategorieId) {
  const w = daten.wuensche.find(x => x.id === wunschId);
  if (!w) return;
  const feld = document.getElementById('el-betrag');
  const betrag = parseBetrag(feld.value);
  if (!(betrag > 0)) { feld.focus(); feld.select && feld.select(); return; }

  const g = beweggrund(GEPLANTER_KAUF_ID) || aktiveBeweggruende()[0] || null;
  let eintragId;

  if (einloesenBar) {
    eintragId = neueId('c');
    daten.bargeld.bewegungen.push({
      id: eintragId,
      datum: heuteISO(),
      betrag: -betrag,
      kategorieId: kategorieId,
      notiz: w.titel,
      beweggrundId: g ? g.id : null,
      geplant: g ? g.geplantStandard : null
    });
  } else {
    const kat = daten.kategorien.find(k => k.id === kategorieId);
    eintragId = neueId('b');
    daten.buchungen.push({
      id: eintragId,
      datum: heuteISO(),
      betrag: -betrag,
      text: w.titel,
      konto: kat ? (kat.konto || 'haushalt') : 'haushalt',
      kategorieId: kategorieId,
      quelle: 'manuell',
      autoZugeordnet: false,
      beweggrundId: g ? g.id : null,
      geplant: g ? g.geplantStandard : null,
      wunschId: w.id
    });
  }

  w.status = 'eingelöst';
  w.buchungId = eintragId;
  speichere();
  schliesseZettel();
  render();
  zeigeQuittung('Eingelöst und verbucht.');
}

/* ── Schuldenabbau ── */

function letzterStand(kredit) {
  if (!kredit.staende || kredit.staende.length === 0) return null;
  return kredit.staende.slice().sort((a, b) => a.datum.localeCompare(b.datum))[kredit.staende.length - 1];
}

function standZumMonat(kredit, monat) {
  // Letzter bekannter Stand bis einschließlich dieses Monats.
  let treffer = null;
  for (const s of (kredit.staende || []).slice().sort((a, b) => a.datum.localeCompare(b.datum))) {
    if (s.datum.slice(0, 7) <= monat) treffer = s;
  }
  return treffer ? treffer.betrag : null;
}

function gesamtSchulden() {
  let summe = 0;
  for (const k of daten.kredite) {
    const s = letzterStand(k);
    if (s) summe += s.betrag;
  }
  return Math.round(summe * 100) / 100;
}

function schuldenVerlauf() {
  // Monatsreihe vom ersten erfassten Stand bis zum aktuellen Blatt.
  const alleDaten = [];
  for (const k of daten.kredite) {
    for (const s of (k.staende || [])) alleDaten.push(s.datum.slice(0, 7));
  }
  if (alleDaten.length === 0) return [];
  const start = alleDaten.sort()[0];
  const ende = aktuellesBlatt();
  const reihe = [];
  let [j, m] = start.split('-').map(Number);
  while (true) {
    const monat = j + '-' + String(m).padStart(2, '0');
    let summe = 0, bekannt = false;
    for (const k of daten.kredite) {
      const wert = standZumMonat(k, monat);
      if (wert !== null) { summe += wert; bekannt = true; }
    }
    if (bekannt) reihe.push({ monat: monat, betrag: Math.round(summe * 100) / 100 });
    if (monat >= ende) break;
    m++;
    if (m > 12) { m = 1; j++; }
    if (reihe.length > 400) break;
  }
  return reihe;
}

function zeichneVerlauf(reihe) {
  if (reihe.length < 2) return '';
  const breite = 300, hoehe = 90, rand = 4;
  const werte = reihe.map(p => p.betrag);
  const max = Math.max.apply(null, werte);
  const min = Math.min.apply(null, werte);
  const spanne = (max - min) || 1;
  const punkte = reihe.map((p, i) => {
    const x = rand + (i / (reihe.length - 1)) * (breite - 2 * rand);
    const y = rand + (1 - (p.betrag - min) / spanne) * (hoehe - 2 * rand);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');

  let svg = '<svg class="federstrich" viewBox="0 0 ' + breite + ' ' + hoehe + '" preserveAspectRatio="none" aria-hidden="true">';
  svg += '<polyline points="' + punkte + '" fill="none" stroke="var(--tinte)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
  svg += '</svg>';
  return svg;
}

function oeffneSchulden() {
  const gesamt = gesamtSchulden();
  const reihe = schuldenVerlauf();
  const start = reihe.length > 0 ? reihe[0].betrag : 0;
  const abgebaut = Math.round((start - gesamt) * 100) / 100;
  const prozent = start > 0 ? (abgebaut / start) * 100 : 0;

  let html = '<div class="zettel-titel">Schulden</div>';

  if (daten.kredite.length === 0) {
    html += '<p class="vermerk">Noch kein Kredit verzeichnet.</p>';
    html += '<p class="hinweistext">Kredite werden mit ihrem jeweiligen Stand erfasst. Der Verlauf entsteht aus den eingetragenen Ständen — ein Eintrag im Monat genügt.</p>';
  } else {
    html += '<section class="saldo-kopf" style="padding-top:0">';
    html += '<div class="zettel">Gesamtstand</div>';
    html += '<div class="saldo-betrag">' + euro(gesamt) + '</div>';
    if (reihe.length > 1 && abgebaut > 0) {
      html += '<div class="frei">abgetragen ' + euro(abgebaut) + ' seit ' + escapeHtml(blattNameLang(reihe[0].monat))
           + ' — ' + prozent.toFixed(1).replace('.', ',') + ' %</div>';
    } else if (reihe.length > 1 && abgebaut < 0) {
      html += '<div class="frei neutral">seit ' + escapeHtml(blattNameLang(reihe[0].monat)) + ' um '
           + euro(-abgebaut) + ' höher</div>';
    }
    html += '</section>';

    if (reihe.length > 1) {
      html += '<div class="buchtitel" style="margin-top:18px">Verlauf</div>';
      html += '<div class="verlauf">' + zeichneVerlauf(reihe) + '</div>';
      html += '<div class="verlauf-marken"><span>' + escapeHtml(blattNameLang(reihe[0].monat)) + '</span>'
           + '<span>' + escapeHtml(blattNameLang(reihe[reihe.length - 1].monat)) + '</span></div>';
    }

    html += '<div class="buchtitel" style="margin-top:18px">Kredite</div>';
    html += '<div class="spaltenkopf"><span>Kredit</span><span></span><span>Stand</span></div>';
    for (const k of daten.kredite) {
      const s = letzterStand(k);
      html += '<button type="button" class="einnahme-zeile" onclick="oeffneKreditDetail(\'' + k.id + '\')">';
      html += '<span class="name">' + escapeHtml(k.name)
           + (s ? ' <em>— Stand vom ' + datumKurz(s.datum) + '</em>' : ' <em>— kein Stand</em>') + '</span>';
      html += '<span class="e-summe schuld">' + (s ? euroOhneZeichen(s.betrag) : '—') + '</span>';
      html += '</button>';
    }
    html += '<div class="abschluss"><span>Summe</span><span class="betrag">' + euro(gesamt) + '</span></div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneKreditEditor(null)">Kredit anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
}

  let html = '<div class="zettel-titel">' + (k ? 'Kredit' : 'Neuer Kredit') + '</div>';
  html += '<div class="feldgruppe"><label for="kr-name">Bezeichnung</label>';

  }

    html += '<button type="button" class="leise rot" id="kr-loeschen" onclick="kreditLoeschenBestaetigen(\'' + k.id + '\')">Löschen</button>';

    html += '<button type="button" class="leise" onclick="oeffneSchulden()">Abbrechen</button>';
