function waehleGeplantStandard(wert) {
  editorGeplantStandard = wert;
  zeichneGeplantWahl();
}

function zeichneGeplantWahl() {
  const jg = document.getElementById('bg-geplant');
  const ng = document.getElementById('bg-ungeplant');
  if (!jg || !ng) return;
  jg.classList.toggle('gewaehlt', editorGeplantStandard === true);
  ng.classList.toggle('gewaehlt', editorGeplantStandard === false);
}

function speichereBeweggrund(beweggrundId) {
  const name = document.getElementById('bg-name').value.trim();
  if (!name) { document.getElementById('bg-name').focus(); return; }
  if (beweggrundId) {
    const g = beweggrund(beweggrundId);
    if (!g) return;
    g.name = name;
    g.geplantStandard = editorGeplantStandard;
  } else {
    const maxReihe = daten.beweggruende.reduce((m, g) => Math.max(m, g.reihenfolge || 0), 0);
    daten.beweggruende.push({
      id: neueId('g'),
      name: name,
      geplantStandard: editorGeplantStandard,
      aktiv: true,
      reihenfolge: maxReihe + 1
    });
  }
  speichere();
  oeffneBeweggruende();
  zeigeQuittung('Verbucht.');
}

function deaktivierenBestaetigen(beweggrundId) {
  const knopf = document.getElementById('bg-deakt');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    const g = beweggrund(beweggrundId);
    if (g) { g.aktiv = false; speichere(); }
    oeffneBeweggruende();
    zeigeQuittung('Ausser Gebrauch gestellt.');
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich? Nochmals tippen.';
    knopf.classList.add('rot');
  }
}

function aktiviereBeweggrund(beweggrundId) {
  const g = beweggrund(beweggrundId);
  if (g) { g.aktiv = true; speichere(); }
  oeffneBeweggruende();
  zeigeQuittung('Wieder aufgenommen.');
}

/* ── Regeln (automatische Zuordnung) ── */

function aktiveRegeln() {
  return daten.regeln.filter(r => r.aktiv);
}

/* Empfänger und Verwendungszweck einer Buchung.
   Neue Buchungen tragen beide Felder getrennt; Altbestand wird am Trennzeichen zerlegt. */
function buchungTeile(b) {
  if (b && (typeof b.empfaenger === 'string' || typeof b.zweck === 'string')) {
    return { empfaenger: b.empfaenger || '', zweck: b.zweck || '' };
  }
  const teile = ((b && b.text) || '').split(' · ');
  return { empfaenger: teile[0] || '', zweck: teile.slice(1).join(' · ') };
}

/* Alle gesetzten Kriterien müssen treffen (UND). Ein leeres Feld wird nicht geprüft. */
function regelTrifft(r, teile) {
  const e = (r.empfaenger || '').toLowerCase().trim();
  const z = (r.zweck || '').toLowerCase().trim();
  if (!e && !z) return false;
  if (e && !teile.empfaenger.toLowerCase().includes(e)) return false;
  if (z && !teile.zweck.toLowerCase().includes(z)) return false;
  return true;
}

/* ── Kurzbezeichnung eines Eintrags (v1.4) ──
   Eine selbstgeschriebene Notiz geht immer vor. Sonst wird aus Empfänger und
   Verwendungszweck eine lesbare Kurzform gebildet. Der Volltext bleibt in
   `text` unangetastet und ist in der Postenansicht antippbar. */

const EMPF_ANHAENGSEL = /\b(gmbh|mbh|ag|kg|ohg|ug|se|s\.?a\.?r\.?l\.?|et\s+cie|s\.?c\.?a\.?|co\.?\s?kg|inc|ltd|llc|b\.?v\.?|n\.?v\.?|europe|deutschland|germany)\b\.?/gi;

function kappe(s, n) {
  s = (s || '').trim();
  return s.length > n ? s.slice(0, n - 1).replace(/[\s,.;:\-]+$/, '') + '…' : s;
}

function kurzEmpfaenger(quelle) {
  let s = (quelle || '').replace(EMPF_ANHAENGSEL, ' ');
  s = s.split(/[\s]+/).filter(w => !/^\d+$/.test(w)).join(' ');
  return s.replace(/[\/\\|*#]+/g, ' ').replace(/\s{2,}/g, ' ').replace(/[\s,.;:\-]+$/, '').trim();
}

function kurzbezeichnung(e) {
  if (e && e.notiz) return kappe(e.notiz, 45);
  const teile = buchungTeile(e);
  const empf = kurzEmpfaenger(teile.empfaenger);
  const ersteEmpf = (tragfaehigeWoerter(teile.empfaenger)[0] || '').toLowerCase();
  const stich = tragfaehigeWoerter(teile.zweck, ersteEmpf)[0] || '';
  let s = empf;
  if (stich) s = s ? s + ' · ' + stich : stich;
  if (!s) s = (teile.empfaenger || teile.zweck || '').trim();
  return kappe(s, 45);
}

function volltextVon(e) {
  const teile = buchungTeile(e);
  const roh = (e && e.text) || [teile.empfaenger, teile.zweck].filter(Boolean).join(' · ');
  if (e && e.notiz && roh) return e.notiz + ' — ' + roh;
  return e && e.notiz ? e.notiz : roh;
}

function findeRegel(b) {
  const teile = buchungTeile(b);
  for (const r of aktiveRegeln()) {
    if (regelTrifft(r, teile)) return r;
  }
  return null;
}

function regelBeschreibung(r) {
  const e = (r.empfaenger || '').trim();
  const z = (r.zweck || '').trim();
  if (e && z) return e + ' + ' + z;
  return e || z || '(ohne Muster)';
}

/* Wörter, die als Muster nichts taugen: Rechtsformen, Bankfloskeln, Referenzkürzel. */
const VORSCHLAG_UEBERGEHEN = [
  'visa', 'der', 'die', 'das', 'den', 'dem', 'und', 'für', 'fuer', 'von', 'vom', 'aus', 'mit',
  'gmbh', 'ag', 'kg', 'ohg', 'mbh', 'ug', 'europe', 'deutschland', 'germany', 'gmbhcokg',
  'sepa', 'lastschrift', 'basislastschrift', 'dauerauftrag', 'überweisung', 'ueberweisung',
  'gutschrift', 'kartenzahlung', 'karte', 'kartenzahl', 'einzug', 'zahlung', 'buchung', 'beleg',
  'eref', 'mref', 'cred', 'svwz', 'abwa', 'abwe', 'kref', 'ref', 'referenz', 'mandat',
  'gläubiger', 'glaeubiger', 'gläubigerid', 'iban', 'bic', 'kfn', 'folgenr', 'verfalld',
  'rechnung', 'rechnungsnr', 'kundennummer', 'kundennr', 'kundenreferenz', 'vertrag',
  'vertragsnr', 'nummer', 'ihre', 'unsere', 'datum', 'uhr', 'nutzung', 'zwecks', 'verwendungszweck'
];

/* Erste tragfähige Wörter einer Quelle, in ursprünglicher Schreibung.
   Alles mit Ziffern fällt weg — Referenznummern, Datumsangaben und
   Kartenfolgenummern wechseln bei jeder Buchung. */
function tragfaehigeWoerter(quelle, ausser) {
  const raus = [];
  for (const w of (quelle || '').split(/[\s,.\/\-:;+*#_|()\[\]]+/)) {
    const k = w.toLowerCase();
    if (k.length < 3) continue;
    if (/\d/.test(k)) continue;
    if (VORSCHLAG_UEBERGEHEN.indexOf(k) >= 0) continue;
    if (ausser && k === ausser) continue;
    raus.push(w);
  }
  return raus;
}

function vorschlagsWort(quelle, ausser) {
  const w = tragfaehigeWoerter(quelle, ausser);
  return w.length ? w[0].toLowerCase() : '';
}

/* Ein Vorschlag, so genau wie möglich: Empfänger plus Verwendungszweck, wenn beides trägt. */
function regelVorschlagFuer(b) {
  const teile = buchungTeile(b);
  const e = vorschlagsWort(teile.empfaenger);
  const z = vorschlagsWort(teile.zweck, e);
  if (!e && !z) return null;
  return { empfaenger: e, zweck: z };
}

function postenName(kategorieId) {
  if (kategorieId === EINNAHME_ID) return 'Einnahme (ohne Zuordnung)';
  if (kategorieId === ABHEBUNG_ID) return 'Bargeldabhebung';
  if (!kategorieId) return 'Kassensturz';
  const k = daten.kategorien.find(x => x.id === kategorieId);
  return k ? k.name : 'Unbekannt';
}

function oeffneRegeln() {
  let html = '<div class="zettel-titel">Regeln</div>';
  html += '<p class="hinweistext">Eine Regel ordnet eingelesene Buchungen selbsttätig einem Posten zu. Geprüft werden Empfänger und Verwendungszweck getrennt; sind beide Felder gefüllt, muss die Buchung beide enthalten. Geprüft wird in dieser Reihenfolge; der erste Treffer gilt. Ein Beweggrund wird nie automatisch vergeben.</p>';
  const umgestellt = daten.regeln.filter(r => r.umgestellt).length;
  if (umgestellt > 0) {
    html += '<p class="hinweistext" style="color:var(--siegellack)">' + umgestellt
         + (umgestellt === 1 ? ' Bestandsregel wurde' : ' Bestandsregeln wurden')
         + ' auf das Feld „Empfänger" umgestellt. Traf ein Muster früher im Verwendungszweck, greift es dort nicht mehr — bitte die gekennzeichneten Regeln kurz durchsehen. Der Vermerk verschwindet, sobald die Regel bestätigt ist.</p>';
  }
  if (daten.regeln.length === 0) {
    html += '<p class="vermerk">Noch keine Regel verzeichnet.</p>';
  } else {
    for (const r of daten.regeln) {
      html += '<button type="button" class="bg-zeile' + (r.aktiv ? '' : ' inaktiv') + '" onclick="oeffneRegelEditor(\'' + r.id + '\')">';
      html += '<span class="b-name">' + escapeHtml(regelBeschreibung(r))
           + (r.umgestellt ? ' <em style="font-style:italic;font-size:0.8rem;color:var(--siegellack)">— umgestellt</em>' : '') + '</span>';
      html += '<span class="b-standard">' + (r.aktiv ? '→ ' + escapeHtml(postenName(r.kategorieId)) : 'ruht') + '</span>';
      html += '</button>';
    }
  }
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneRegelEditor(null)">Regel anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
}

let regelEditorPosten = null;

function oeffneRegelEditor(regelId, vorbelegt, postenVorbelegt) {
  const r = regelId ? daten.regeln.find(x => x.id === regelId) : null;
  regelEditorPosten = r ? r.kategorieId : (postenVorbelegt || null);
  const vorE = r ? (r.empfaenger || '') : ((vorbelegt && vorbelegt.empfaenger) || '');
  const vorZ = r ? (r.zweck || '') : ((vorbelegt && vorbelegt.zweck) || '');

  let html = '<div class="zettel-titel">' + (r ? 'Regel' : 'Neue Regel') + '</div>';
  html += '<div class="feldgruppe"><label for="rg-empfaenger">Wenn der Empfänger enthält</label>';
  html += '<input class="feld" id="rg-empfaenger" type="text" autocomplete="off" autocapitalize="none" oninput="pruefeRegelWarnung()" value="'
       + escapeHtml(vorE) + '" placeholder="z. B. edeka"></div>';
  html += '<div class="feldgruppe"><label for="rg-zweck">und der Verwendungszweck enthält</label>';
  html += '<input class="feld" id="rg-zweck" type="text" autocomplete="off" autocapitalize="none" oninput="pruefeRegelWarnung()" value="'
       + escapeHtml(vorZ) + '" placeholder="frei lassen, wenn gleichgültig"></div>';
  html += '<p class="hinweistext" id="rg-warnung" style="display:none;color:var(--siegellack)">Ohne Verwendungszweck greift die Regel auf <b>alle</b> Zahlungen an diesen Empfänger.</p>';
  html += '<div class="feldgruppe"><label>Dann verbuchen auf</label></div>';
  html += '<div class="postenwahl">';
  const posten = ausgabePosten();
  for (const p of posten) {
    html += '<button type="button" class="wahl-posten" onclick="waehleRegelPosten(\'' + p.id + '\')">'
         + '<span class="w-name">' + escapeHtml(p.name) + '</span>'
         + '<span class="w-rest">' + (regelEditorPosten === p.id ? 'gewählt' : '') + '</span></button>';
  }
  for (const p of einnahmePosten()) {
    html += '<button type="button" class="wahl-posten" onclick="waehleRegelPosten(\'' + p.id + '\')">'
         + '<span class="w-name">' + escapeHtml(p.name) + ' <em style="font-style:italic;font-size:0.8rem;color:var(--tinte-blass)">— Einnahme</em></span>'
         + '<span class="w-rest">' + (regelEditorPosten === p.id ? 'gewählt' : '') + '</span></button>';
  }
  html += '<button type="button" class="wahl-posten" onclick="waehleRegelPosten(\'' + ABHEBUNG_ID + '\')">'
       + '<span class="w-name">Bargeldabhebung <em style="font-style:italic;font-size:0.8rem;color:var(--tinte-blass)">— in die Kasse</em></span>'
       + '<span class="w-rest">' + (regelEditorPosten === ABHEBUNG_ID ? 'gewählt' : '') + '</span></button>';
  html += '</div>';
  html += '<div class="knopfzeile">';
  if (r) {
    html += '<button type="button" class="leise" id="rg-loeschen" onclick="regelLoeschenBestaetigen(\'' + r.id + '\')">Löschen</button>';
    html += '<button type="button" class="leise" onclick="regelUmschalten(\'' + r.id + '\')">' + (r.aktiv ? 'Ruhen lassen' : 'Wieder anwenden') + '</button>';
  } else {
    html += '<button type="button" class="leise" onclick="oeffneRegeln()">Zurück</button>';
  }
  html += '<button type="button" class="knopf primaer" onclick="speichereRegel(' + (r ? '\'' + r.id + '\'' : 'null') + ')">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  pruefeRegelWarnung();
  if (!r && !vorbelegt) document.getElementById('rg-empfaenger').focus();
}

function pruefeRegelWarnung() {
  const fe = document.getElementById('rg-empfaenger');
  const fz = document.getElementById('rg-zweck');
  const w = document.getElementById('rg-warnung');
  if (!fe || !fz || !w) return;
  w.style.display = (fe.value.trim() && !fz.value.trim()) ? 'block' : 'none';
}

function waehleRegelPosten(kategorieId) {
  regelEditorPosten = kategorieId;
  zeichneRegelPostenwahl();
}

function zeichneRegelPostenwahl() {
  const knoepfe = zettel.querySelectorAll('.wahl-posten');
  knoepfe.forEach(k => {
    const treffer = (k.getAttribute('onclick') || '').match(/'([^']+)'/);
    const id = treffer ? treffer[1] : null;
    const rest = k.querySelector('.w-rest');
    if (rest) rest.textContent = (id === regelEditorPosten) ? 'gewählt' : '';
  });
}

function speichereRegel(regelId) {
  const mEmpf = document.getElementById('rg-empfaenger').value.trim();
  const mZweck = document.getElementById('rg-zweck').value.trim();
  if (!mEmpf && !mZweck) {
    zeigeQuittung('Empfänger oder Verwendungszweck angeben.');
    document.getElementById('rg-empfaenger').focus();
    return;
  }
  if (!regelEditorPosten) { zeigeQuittung('Posten wählen.'); return; }
  if (regelId) {
    const r = daten.regeln.find(x => x.id === regelId);
    if (!r) return;
    r.feld = 'kombi';
    r.empfaenger = mEmpf;
    r.zweck = mZweck;
    r.kategorieId = regelEditorPosten;
    delete r.umgestellt; // bestätigt — der Vermerk erlischt
  } else {
    daten.regeln.push({
      id: neueId('r'),
      feld: 'kombi',
      empfaenger: mEmpf,
      zweck: mZweck,
      kategorieId: regelEditorPosten,
      aktiv: true
    });
  }
  speichere();
  oeffneRegeln();
  zeigeQuittung('Verbucht.');
}

function regelUmschalten(regelId) {
  const r = daten.regeln.find(x => x.id === regelId);
  if (r) { r.aktiv = !r.aktiv; speichere(); }
  oeffneRegeln();
}

function regelLoeschenBestaetigen(regelId) {
  const knopf = document.getElementById('rg-loeschen');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    const i = daten.regeln.findIndex(x => x.id === regelId);
    if (i >= 0) daten.regeln.splice(i, 1);
    speichere();
    oeffneRegeln();
    zeigeQuittung('Regel gelöscht.');
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich? Nochmals tippen.';
    knopf.classList.add('rot');
  }
}

function sichereSammelposten() {
  // Der Sammelposten entsteht nur, wenn er gebraucht wird (Altbestand oder neue Gutschrift).
  if (daten.kategorien.some(k => k.id === EINNAHME_ID)) return;
  daten.kategorien.push({
    id: EINNAHME_ID,
    name: 'Einnahme (ohne Zuordnung)',
    typ: 'einnahme',
    konto: 'giro',
    monatsbudget: 0,
    reihenfolge: 0,
    archiviert: false
  });
}

/* ── Einnahmen ── */

function einnahmenImBlatt(blatt) {
  return daten.buchungen.filter(b => b.betrag > 0 && b.kategorieId && blattVon(b.datum) === blatt);
}

function einnahmeSumme(kategorieId, blatt) {
  let summe = 0;
  for (const b of daten.buchungen) {
    if (b.kategorieId === kategorieId && b.betrag > 0 && blattVon(b.datum) === blatt) summe += b.betrag;
  }
  return summe;
}

function oeffneEinnahmen(blatt) {
  const bl = blatt || angezeigtesBlatt;
  const posten = daten.kategorien.filter(k => istEinnahmePosten(k))
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));
  const mitEintraegen = posten.filter(p => einnahmeSumme(p.id, bl) > 0 || (!p.archiviert && p.id !== EINNAHME_ID));
  let gesamt = 0;
  for (const p of posten) gesamt += einnahmeSumme(p.id, bl);

  let html = '<div class="zettel-titel">Einnahmen · Blatt ' + escapeHtml(blattName(bl)) + '</div>';

  if (posten.length === 0) {
    html += '<p class="vermerk">Noch kein Einnahme-Posten angelegt.</p>';
  } else {
    html += '<div class="spaltenkopf"><span>Posten</span><span></span><span>Summe</span></div>';
    for (const p of mitEintraegen) {
      const summe = einnahmeSumme(p.id, bl);
      html += '<button type="button" class="einnahme-zeile" onclick="oeffneEinnahmeDetail(\'' + p.id + '\')">';
      html += '<span class="name">' + escapeHtml(p.name) + (p.archiviert ? ' <em>— archiviert</em>' : '') + '</span>';
      html += '<span class="e-summe">' + euroOhneZeichen(summe) + '</span>';
      html += '</button>';
    }
    html += '<div class="abschluss"><span>Summe der Einnahmen</span><span class="betrag">' + euro(gesamt) + '</span></div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneEinnahmePostenNeu()">Posten anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function oeffneEinnahmePostenNeu() {
  let html = '<div class="zettel-titel">Neuer Einnahme-Posten</div>';
  html += '<div class="feldgruppe"><label for="en-name">Bezeichnung</label>';
  html += '<input class="feld" id="en-name" type="text" autocomplete="off" placeholder="z. B. Gehalt"></div>';
  html += '<p class="hinweistext">Einnahmen zählen in kein Budget. Sie werden verzeichnet und hier summiert.</p>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneEinnahmen()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="legeEinnahmePostenAn()">Anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('en-name').focus();
}

function legeEinnahmePostenAn() {
  const name = document.getElementById('en-name').value.trim();
  if (!name) { document.getElementById('en-name').focus(); return; }
  const maxReihe = daten.kategorien.reduce((m, k) => Math.max(m, k.reihenfolge || 0), 0);
  daten.kategorien.push({
    id: neueId('k'),
    name: name,
    typ: 'einnahme',
    konto: 'giro',
    monatsbudget: 0,
    reihenfolge: maxReihe + 1,
    archiviert: false
  });
  speichere();
  oeffneEinnahmen();
  zeigeQuittung('Posten angelegt.');
}

function oeffneEinnahmeDetail(kategorieId) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  const bl = angezeigtesBlatt;
  const eintraege = daten.buchungen
    .filter(b => b.kategorieId === kategorieId && b.betrag > 0 && blattVon(b.datum) === bl)
    .sort((a, b) => b.datum.localeCompare(a.datum) || b.id.localeCompare(a.id));

  let html = '<div class="zettel-titel">Einnahme-Posten</div>';
  if (p.id === EINNAHME_ID) {
    html += '<p class="hinweistext"><b>' + escapeHtml(p.name) + '</b> — Sammelposten für Gutschriften ohne eigene Zuordnung. Einzelne Einträge lassen sich hier umbuchen.</p>';
  } else {
    html += '<div class="feldgruppe"><label for="ed-name">Bezeichnung</label>';
    html += '<input class="feld" id="ed-name" type="text" autocomplete="off" value="' + escapeHtml(p.name) + '"></div>';
    html += '<div class="knopfzeile" style="margin-top:4px;margin-bottom:8px">';
    if (p.archiviert) {
      html += '<button type="button" class="leise" onclick="archiviereEinnahmePosten(\'' + p.id + '\', false)">Wieder aufnehmen</button>';
    } else {
      html += '<button type="button" class="leise" id="ed-arch" onclick="einnahmeArchivierenBestaetigen(\'' + p.id + '\')">Posten archivieren</button>';
    }
    html += '<button type="button" class="knopf primaer" onclick="speichereEinnahmePosten(\'' + p.id + '\')">Übernehmen</button>';
    html += '</div>';
  }

  html += '<div class="buchtitel" style="margin-top:14px">Einträge · Blatt ' + escapeHtml(blattName(bl)) + '</div>';
  if (eintraege.length === 0) {
    html += '<p class="hinweistext" style="text-align:center">Kein Eintrag auf diesem Blatt.</p>';
  } else {
    html += '<div class="eintragsliste">';
    for (const b of eintraege) {
      html += '<div class="eintragszeile">';
      html += '<span class="e-datum">' + datumKurz(b.datum) + '</span>';
      html += '<span class="e-betrag">' + euro(b.betrag) + '</span>';
      html += '<button type="button" onclick="oeffneEinnahmeUmbuchen(\'' + b.id + '\', \'' + p.id + '\')">umbuchen</button>';
      if (b.text) html += '<span class="e-auto">' + escapeHtml(b.text.length > 90 ? b.text.slice(0, 90) + '…' : b.text) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneEinnahmen()">Zurück</button></div>';
  oeffneZettel(html);
}

function speichereEinnahmePosten(kategorieId) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  const name = document.getElementById('ed-name').value.trim();
  if (!name) { document.getElementById('ed-name').focus(); return; }
  p.name = name;
  speichere();
  oeffneEinnahmen();
  zeigeQuittung('Verbucht.');
}

function einnahmeArchivierenBestaetigen(kategorieId) {
  const knopf = document.getElementById('ed-arch');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    archiviereEinnahmePosten(kategorieId, true);
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich archivieren? Nochmals tippen.';
    knopf.classList.add('rot');
  }
}

function archiviereEinnahmePosten(kategorieId, archivieren) {
  const p = daten.kategorien.find(k => k.id === kategorieId);
  if (!p) return;
  p.archiviert = archivieren;
  speichere();
  oeffneEinnahmen();
  zeigeQuittung(archivieren ? 'Posten archiviert.' : 'Posten wieder aufgenommen.');
}

function oeffneEinnahmeUmbuchen(buchungId, herkunftId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  const posten = daten.kategorien.filter(k => istEinnahmePosten(k) && !k.archiviert && k.id !== b.kategorieId)
    .sort((x, y) => (x.reihenfolge || 0) - (y.reihenfolge || 0) || x.name.localeCompare(y.name, 'de'));

  let html = '<div class="zettel-titel">Umbuchen</div>';
  html += '<div class="korb-karte">';
  html += '<div class="korb-kopf"><span class="k-datum">' + datumLang(b.datum) + '</span>';
  html += '<span class="k-betrag haben">+' + euro(b.betrag) + '</span></div>';
  if (b.text) html += '<div class="korb-zweck">' + escapeHtml(b.text.length > 140 ? b.text.slice(0, 140) + '…' : b.text) + '</div>';
  html += '</div>';
  html += '<p class="hinweistext">Jetzt verbucht auf <b>' + escapeHtml(postenName(b.kategorieId)) + '</b>. Neuen Posten wählen:</p>';
  if (posten.length === 0) {
    html += '<p class="hinweistext" style="text-align:center">Kein weiterer Einnahme-Posten vorhanden.</p>';
  } else {
    html += '<div class="postenwahl">';
    for (const p of posten) {
      html += '<button type="button" class="wahl-posten" onclick="fuehreEinnahmeUmbuchungAus(\'' + b.id + '\', \'' + p.id + '\', \'' + herkunftId + '\')">'
           + '<span class="w-name">' + escapeHtml(p.name) + '</span><span class="w-rest"></span></button>';
    }
    html += '</div>';
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneEinnahmeDetail(\'' + herkunftId + '\')">Abbrechen</button></div>';
  oeffneZettel(html);
}

function fuehreEinnahmeUmbuchungAus(buchungId, zielId, herkunftId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  b.kategorieId = zielId;
  b.autoZugeordnet = false;
  speichere();
  zeigeQuittung('Umgebucht.');
  oeffneEinnahmeDetail(herkunftId);
}

/* ── Kasse (Bargeldbestand) ── */

function oeffneKasse() {
  const bestand = kassenBestand();
  const abhebungen = daten.buchungen.filter(b => b.kategorieId === ABHEBUNG_ID)
    .map(b => ({ datum: b.datum, betrag: Math.abs(b.betrag), art: 'Abhebung', id: b.id, bar: false }));
  const ausgaben = daten.bargeld.bewegungen
    .map(c => ({ datum: c.datum, betrag: c.betrag, art: c.kategorieId === null ? 'Kassensturz' : postenName(c.kategorieId), id: c.id, bar: true }));
  const alle = abhebungen.concat(ausgaben)
    .sort((a, b) => b.datum.localeCompare(a.datum) || b.id.localeCompare(a.id))
    .slice(0, 40);

  let html = '<div class="zettel-titel">Kasse</div>';
  html += '<section class="saldo-kopf" style="padding-top:0">';
  html += '<div class="zettel">In der Kasse</div>';
  html += '<div class="saldo-betrag' + (bestand < 0 ? ' ueberzogen' : '') + '">' + euro(bestand) + '</div>';
  html += '</section>';

  html += '<div class="buchtitel" style="margin-top:16px">Bewegungen</div>';
  if (alle.length === 0) {
    html += '<p class="vermerk">Noch keine Bewegung verzeichnet.</p>';
    html += '<p class="hinweistext">Abhebungen erkennt die App über eine Regel auf den Posten „Bargeldabhebung". Barausgaben werden im Eintrag über „bar" erfasst.</p>';
  } else {
    html += '<div class="eintragsliste">';
    for (const z of alle) {
      html += '<div class="eintragszeile">';
      html += '<span class="e-datum">' + datumKurz(z.datum) + '</span>';
      html += '<span class="e-betrag' + (z.betrag > 0 ? ' haben' : '') + '">' + (z.betrag > 0 ? '+' : '−') + euro(Math.abs(z.betrag)) + '</span>';
      html += '<span class="e-auto">' + escapeHtml(z.art) + '</span>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="schliesseZettel()">Schließen</button>';
  html += '<button type="button" class="knopf" onclick="oeffneKassensturz()">Kasse zählen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function oeffneKassensturz() {
  const bestand = kassenBestand();
  let html = '<div class="zettel-titel">Kasse zählen</div>';
  html += '<p class="hinweistext">Verzeichnet sind <b>' + euro(bestand) + '</b>. Den tatsächlich gezählten Betrag eintragen — die Differenz wird als Ausgleich verzeichnet, ohne Budgetwirkung.</p>';
  html += '<div class="feldgruppe"><label for="ks-betrag">Gezählt</label>';
  html += '<input class="feld betrag" id="ks-betrag" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off"></div>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneKasse()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="fuehreKassensturzAus()">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('ks-betrag').focus();
}

function fuehreKassensturzAus() {
  const feld = document.getElementById('ks-betrag');
  const gezaehlt = parseBetrag(feld.value);
  if (!isFinite(gezaehlt) || gezaehlt < 0) { feld.focus(); return; }
  const bestand = kassenBestand();
  const differenz = Math.round((gezaehlt - bestand) * 100) / 100;
  if (differenz === 0) {
    oeffneKasse();
    zeigeQuittung('Kasse stimmt.');
    return;
  }
  daten.bargeld.bewegungen.push({
    id: neueId('c'),
    datum: heuteISO(),
    betrag: differenz,
    kategorieId: null,   // ohne Posten = nie budgetwirksam
    notiz: 'Kassensturz',
    beweggrundId: null,
    geplant: null
  });
  speichere();
  render();
  oeffneKasse();
  zeigeQuittung('Kasse berichtigt.');
}

/* ── Vormerkbuch ── */

const GEPLANTER_KAUF_ID = 'g_geplant';

function offeneWuensche() {
  return daten.wuensche.filter(w => w.status === 'offen');
}

function vorgemerktSumme() {
  let summe = 0;
  for (const w of offeneWuensche()) summe += (w.betrag || 0);
  return summe;
}

function wunschgruppe(id) {
  return daten.wunschgruppen.find(g => g.id === id) || null;
}

function oeffneVormerkbuch() {
  const offen = offeneWuensche();
  const gruppen = daten.wunschgruppen.slice()
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));

  let html = '<div class="zettel-titel">Vormerkbuch</div>';

  if (offen.length === 0 && gruppen.length === 0) {
    html += '<p class="vermerk">Noch nichts vorgemerkt.</p>';
    html += '<p class="hinweistext">Vormerkungen sind Anschaffungen, die noch bevorstehen. Sie zählen in kein Budget, solange sie nicht eingelöst sind.</p>';
  } else {
    const ohneGruppe = offen.filter(w => !w.gruppeId || !wunschgruppe(w.gruppeId));
    for (const g of gruppen) {
      const inGruppe = offen.filter(w => w.gruppeId === g.id);
      html += '<div class="buchtitel" style="margin-top:16px">' + escapeHtml(g.name) + '</div>';
      if (inGruppe.length === 0) {
        html += '<p class="hinweistext" style="text-align:center;margin:6px 0">Keine offene Vormerkung.</p>';
      } else {
        html += baueWunschliste(inGruppe);
      }
    }
    if (ohneGruppe.length > 0) {
      html += '<div class="buchtitel" style="margin-top:16px">Ohne Gruppe</div>';
      html += baueWunschliste(ohneGruppe);
    }
    const summe = vorgemerktSumme();
    if (summe > 0) {
      html += '<div class="abschluss"><span>Vorgemerkt</span><span class="betrag">' + euro(summe) + '</span></div>';
      html += '<p class="vermerk">Nicht budgetwirksam — erst beim Einlösen.</p>';
    }
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneWunschEditor(null)">Vormerken</button>';
  html += '</div>';
  html += '<div class="korb-fuss">';
  html += '<button type="button" onclick="oeffneWunschgruppen()">Gruppen ordnen</button>';
  html += '<span class="trenner"> · </span>';
  html += '<button type="button" onclick="oeffneWunschArchiv()">Erledigtes</button>';
  html += '</div>';
  oeffneZettel(html);
}

function baueWunschliste(liste) {
  let html = '';
  for (const w of liste) {
    html += '<button type="button" class="wunsch-zeile" onclick="oeffneWunschDetail(\'' + w.id + '\')">';
    html += '<span class="w-titel">' + escapeHtml(w.titel) + '</span>';
    html += '<span class="w-betrag">' + (w.betrag ? euroOhneZeichen(w.betrag) : '—') + '</span>';
    if (w.postenId) {
      html += '<span class="w-ziel">für ' + escapeHtml(postenName(w.postenId)) + '</span>';
    }
    if (w.notiz) {
      html += '<span class="w-notiz">' + escapeHtml(w.notiz.length > 80 ? w.notiz.slice(0, 80) + '…' : w.notiz) + '</span>';
    }
    html += '</button>';
  }
  return html;
}

let wunschEditorGruppe = null;
let wunschEditorPosten = null;

function oeffneWunschEditor(wunschId) {
  const w = wunschId ? daten.wuensche.find(x => x.id === wunschId) : null;
  wunschEditorGruppe = w ? w.gruppeId : (daten.wunschgruppen.length === 1 ? daten.wunschgruppen[0].id : null);
  wunschEditorPosten = w ? w.postenId : null;

  let html = '<div class="zettel-titel">' + (w ? 'Vormerkung' : 'Neue Vormerkung') + '</div>';
  html += '<div class="feldgruppe"><label for="wu-titel">Was</label>';
  html += '<input class="feld" id="wu-titel" type="text" autocomplete="off" value="' + (w ? escapeHtml(w.titel) : '') + '" placeholder="z. B. Fahrradhelm"></div>';
  html += '<div class="feldgruppe"><label for="wu-betrag">Geschätzter Betrag — freiwillig</label>';
  html += '<input class="feld" id="wu-betrag" type="text" inputmode="decimal" autocomplete="off" value="' + (w && w.betrag ? euroOhneZeichen(w.betrag) : '') + '" placeholder="0,00"></div>';

  html += '<div class="feldgruppe"><label>Gruppe — freiwillig</label><div class="streifen-reihe">';
  for (const g of daten.wunschgruppen.sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0))) {
    html += '<button type="button" class="stempel' + (wunschEditorGruppe === g.id ? ' gewaehlt' : '') + '" onclick="waehleWunschGruppe(\'' + g.id + '\')">' + escapeHtml(g.name) + '</button>';
  }
  html += '<button type="button" class="stempel" onclick="oeffneWunschgruppeNeu()">+ Gruppe</button>';
  html += '</div></div>';

  html += '<div class="feldgruppe"><label>Ziel-Posten — freiwillig</label><div class="streifen-reihe">';
  for (const p of ausgabePosten()) {
    html += '<button type="button" class="stempel' + (wunschEditorPosten === p.id ? ' gewaehlt' : '') + '" onclick="waehleWunschPosten(\'' + p.id + '\')">' + escapeHtml(p.name) + '</button>';
  }
  html += '</div></div>';

  html += '<div class="feldgruppe"><label for="wu-notiz">Notiz — freiwillig</label>';
  html += '<input class="feld" id="wu-notiz" type="text" autocomplete="off" value="' + (w && w.notiz ? escapeHtml(w.notiz) : '') + '" placeholder=""></div>';

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="' + (w ? 'oeffneWunschDetail(\'' + w.id + '\')' : 'oeffneVormerkbuch()') + '">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="speichereWunsch(' + (w ? '\'' + w.id + '\'' : 'null') + ')">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  if (!w) document.getElementById('wu-titel').focus();
}

function waehleWunschGruppe(gruppeId) {
  wunschEditorGruppe = wunschEditorGruppe === gruppeId ? null : gruppeId;
  zeichneWunschWahl();
}

function waehleWunschPosten(postenId) {
  wunschEditorPosten = wunschEditorPosten === postenId ? null : postenId;
  zeichneWunschWahl();
}

function zeichneWunschWahl() {
  const reihen = zettel.querySelectorAll('.streifen-reihe');
  reihen.forEach(reihe => {
    reihe.querySelectorAll('.stempel').forEach(k => {
      const treffer = (k.getAttribute('onclick') || '').match(/'([^']+)'/);
      const id = treffer ? treffer[1] : null;
      const istGruppe = (k.getAttribute('onclick') || '').includes('waehleWunschGruppe');
      const istPosten = (k.getAttribute('onclick') || '').includes('waehleWunschPosten');
      if (istGruppe) k.classList.toggle('gewaehlt', id === wunschEditorGruppe);
      if (istPosten) k.classList.toggle('gewaehlt', id === wunschEditorPosten);
    });
  });
}

function speichereWunsch(wunschId) {
  const titel = document.getElementById('wu-titel').value.trim();
  if (!titel) { document.getElementById('wu-titel').focus(); return; }
  const betragRoh = document.getElementById('wu-betrag').value.trim();
  const betrag = betragRoh ? parseBetrag(betragRoh) : null;
  if (betragRoh && !(betrag >= 0)) { document.getElementById('wu-betrag').focus(); return; }
  const notiz = document.getElementById('wu-notiz').value.trim();

  if (wunschId) {
    const w = daten.wuensche.find(x => x.id === wunschId);
    if (!w) return;
    w.titel = titel;
    w.betrag = betrag;
    w.gruppeId = wunschEditorGruppe;
    w.postenId = wunschEditorPosten;
    w.notiz = notiz;
  } else {
    daten.wuensche.push({
      id: neueId('w'),
      titel: titel,
      gruppeId: wunschEditorGruppe,
      betrag: betrag,
      postenId: wunschEditorPosten,
      notiz: notiz,
      erstellt: heuteISO(),
      status: 'offen',
      buchungId: null
    });
  }
  speichere();
  render();
  oeffneVormerkbuch();
  zeigeQuittung('Vorgemerkt.');
}

function oeffneWunschDetail(wunschId) {

  let html = '<div class="zettel-titel">Vormerkung</div>';

function wunschWiederAufnehmen(wunschId) {
  const w = daten.wuensche.find(x => x.id === wunschId);
  if (w && w.status === 'verworfen') { w.status = 'offen'; w.buchungId = null; speichere(); }
  render();
  oeffneVormerkbuch();
  zeigeQuittung('Wieder aufgenommen.');
}

/* Einlösen: höchstens zwei Tipps bis zur Buchung */

let einloesenBar = false;

function oeffneEinloesen(wunschId) {
  const w = daten.wuensche.find(x => x.id === wunschId);
  if (!w) return;
  const posten = ausgabePosten();
  if (posten.length === 0) { zeigeQuittung('Erst einen Posten anlegen.'); return; }
  const blatt = aktuellesBlatt();

  let html = '<div class="zettel-titel">Einlösen</div>';
  html += '<p class="hinweistext" style="text-align:center"><b>' + escapeHtml(w.titel) + '</b></p>';
  html += '<div class="feldgruppe"><label for="el-betrag">Betrag in Euro</label>';
  html += '<input class="feld betrag" id="el-betrag" type="text" inputmode="decimal" autocomplete="off" value="'
       + (w.betrag ? euroOhneZeichen(w.betrag) : '') + '" placeholder="0,00"></div>';
  html += '<div class="feldgruppe"><label>Bezahlt</label><div class="wahl2">';
  html += '<button type="button" class="' + (einloesenBar ? '' : 'gewaehlt') + '" onclick="waehleEinloesenArt(\'' + w.id + '\', false)">vom Konto</button>';
  html += '<button type="button" class="' + (einloesenBar ? 'gewaehlt' : '') + '" onclick="waehleEinloesenArt(\'' + w.id + '\', true)">bar</button>';
  html += '</div></div>';
  html += '<p class="hinweistext">Der Beweggrund wird auf „Geplanter Kauf" gesetzt.</p>';
  html += '<div class="feldgruppe" style="margin-bottom:6px"><label>Posten wählen — verbucht sofort</label></div>';
  html += '<div class="postenwahl">';
  const sortiert = w.postenId
    ? posten.slice().sort((a, b) => (a.id === w.postenId ? -1 : 0) - (b.id === w.postenId ? -1 : 0))
    : posten;
  for (const p of sortiert) {
    const rest = (p.monatsbudget || 0) - istBetrag(p.id, blatt);
    html += '<button type="button" class="wahl-posten" onclick="loeseWunschEin(\'' + w.id + '\', \'' + p.id + '\')">'
         + '<span class="w-name">' + escapeHtml(p.name) + (p.id === w.postenId ? ' <em style="font-size:0.78rem;color:var(--tinte-blass)">— vorgemerkt</em>' : '') + '</span>'
         + '<span class="w-rest' + (rest < 0 ? ' rot' : '') + '">' + (rest < 0 ? 'überzogen um ' + euro(-rest) : 'verbleiben ' + euro(rest)) + '</span></button>';
  }
  html += '</div>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneWunschDetail(\'' + w.id + '\')">Abbrechen</button></div>';
  oeffneZettel(html);
}

function waehleEinloesenArt(wunschId, bar) {
  einloesenBar = bar;
  const betrag = document.getElementById('el-betrag').value;
  oeffneEinloesen(wunschId);
  document.getElementById('el-betrag').value = betrag;
}

function loeseWunschEin(wunschId, kategorieId) {
  const w = daten.wuensche.find(x => x.id === wunschId);
  if (!w) return;
  const feld = document.getElementById('el-betrag');
  const betrag = parseBetrag(feld.value);
  if (!(betrag > 0)) { feld.focus(); feld.select && feld.select(); return; }

  const g = beweggrund(GEPLANTER_KAUF_ID) || aktiveBeweggruende()[0] || null;
  let eintragId;

  if (einloesenBar) {
    eintragId = neueId('c');
    daten.bargeld.bewegungen.push({
      id: eintragId,
      datum: heuteISO(),
      betrag: -betrag,
      kategorieId: kategorieId,
      notiz: w.titel,
      beweggrundId: g ? g.id : null,
      geplant: g ? g.geplantStandard : null
    });
  } else {
    const kat = daten.kategorien.find(k => k.id === kategorieId);
    eintragId = neueId('b');
    daten.buchungen.push({
      id: eintragId,
      datum: heuteISO(),
      betrag: -betrag,
      text: w.titel,
      konto: kat ? (kat.konto || 'haushalt') : 'haushalt',
      kategorieId: kategorieId,
      quelle: 'manuell',
      autoZugeordnet: false,
      beweggrundId: g ? g.id : null,
      geplant: g ? g.geplantStandard : null,
      wunschId: w.id
    });
  }

  w.status = 'eingelöst';
  w.buchungId = eintragId;
  speichere();
  schliesseZettel();
  render();
  zeigeQuittung('Eingelöst und verbucht.');
}

/* ── Schuldenabbau ── */

function letzterStand(kredit) {
  if (!kredit.staende || kredit.staende.length === 0) return null;
  return kredit.staende.slice().sort((a, b) => a.datum.localeCompare(b.datum))[kredit.staende.length - 1];
}

function standZumMonat(kredit, monat) {
  // Letzter bekannter Stand bis einschließlich dieses Monats.
  let treffer = null;
  for (const s of (kredit.staende || []).slice().sort((a, b) => a.datum.localeCompare(b.datum))) {
    if (s.datum.slice(0, 7) <= monat) treffer = s;
  }
  return treffer ? treffer.betrag : null;
}

function gesamtSchulden() {
  let summe = 0;
  for (const k of daten.kredite) {
    const s = letzterStand(k);
    if (s) summe += s.betrag;
  }
  return Math.round(summe * 100) / 100;
}

function schuldenVerlauf() {
  // Monatsreihe vom ersten erfassten Stand bis zum aktuellen Blatt.
  const alleDaten = [];
  for (const k of daten.kredite) {
    for (const s of (k.staende || [])) alleDaten.push(s.datum.slice(0, 7));
  }
  if (alleDaten.length === 0) return [];
  const start = alleDaten.sort()[0];
  const ende = aktuellesBlatt();
  const reihe = [];
  let [j, m] = start.split('-').map(Number);
  while (true) {
    const monat = j + '-' + String(m).padStart(2, '0');
    let summe = 0, bekannt = false;
    for (const k of daten.kredite) {
      const wert = standZumMonat(k, monat);
      if (wert !== null) { summe += wert; bekannt = true; }
    }
    if (bekannt) reihe.push({ monat: monat, betrag: Math.round(summe * 100) / 100 });
    if (monat >= ende) break;
    m++;
    if (m > 12) { m = 1; j++; }
    if (reihe.length > 400) break;
  }
  return reihe;
}

function zeichneVerlauf(reihe) {
  if (reihe.length < 2) return '';
  const breite = 300, hoehe = 90, rand = 4;
  const werte = reihe.map(p => p.betrag);
  const max = Math.max.apply(null, werte);
  const min = Math.min.apply(null, werte);
  const spanne = (max - min) || 1;
  const punkte = reihe.map((p, i) => {
    const x = rand + (i / (reihe.length - 1)) * (breite - 2 * rand);
    const y = rand + (1 - (p.betrag - min) / spanne) * (hoehe - 2 * rand);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');

  let svg = '<svg class="federstrich" viewBox="0 0 ' + breite + ' ' + hoehe + '" preserveAspectRatio="none" aria-hidden="true">';
  svg += '<polyline points="' + punkte + '" fill="none" stroke="var(--tinte)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>';
  svg += '</svg>';
  return svg;
}

function oeffneSchulden() {
  const gesamt = gesamtSchulden();
  const reihe = schuldenVerlauf();
  const start = reihe.length > 0 ? reihe[0].betrag : 0;
  const abgebaut = Math.round((start - gesamt) * 100) / 100;
  const prozent = start > 0 ? (abgebaut / start) * 100 : 0;

  let html = '<div class="zettel-titel">Schulden</div>';

  if (daten.kredite.length === 0) {
    html += '<p class="vermerk">Noch kein Kredit verzeichnet.</p>';
    html += '<p class="hinweistext">Kredite werden mit ihrem jeweiligen Stand erfasst. Der Verlauf entsteht aus den eingetragenen Ständen — ein Eintrag im Monat genügt.</p>';
  } else {
    html += '<section class="saldo-kopf" style="padding-top:0">';
    html += '<div class="zettel">Gesamtstand</div>';
    html += '<div class="saldo-betrag">' + euro(gesamt) + '</div>';
    if (reihe.length > 1 && abgebaut > 0) {
      html += '<div class="frei">abgetragen ' + euro(abgebaut) + ' seit ' + escapeHtml(blattNameLang(reihe[0].monat))
           + ' — ' + prozent.toFixed(1).replace('.', ',') + ' %</div>';
    } else if (reihe.length > 1 && abgebaut < 0) {
      html += '<div class="frei neutral">seit ' + escapeHtml(blattNameLang(reihe[0].monat)) + ' um '
           + euro(-abgebaut) + ' höher</div>';
    }
    html += '</section>';

    if (reihe.length > 1) {
      html += '<div class="buchtitel" style="margin-top:18px">Verlauf</div>';
      html += '<div class="verlauf">' + zeichneVerlauf(reihe) + '</div>';
      html += '<div class="verlauf-marken"><span>' + escapeHtml(blattNameLang(reihe[0].monat)) + '</span>'
           + '<span>' + escapeHtml(blattNameLang(reihe[reihe.length - 1].monat)) + '</span></div>';
    }

    html += '<div class="buchtitel" style="margin-top:18px">Kredite</div>';
    html += '<div class="spaltenkopf"><span>Kredit</span><span></span><span>Stand</span></div>';
    for (const k of daten.kredite) {
      const s = letzterStand(k);
      html += '<button type="button" class="einnahme-zeile" onclick="oeffneKreditDetail(\'' + k.id + '\')">';
      html += '<span class="name">' + escapeHtml(k.name)
           + (s ? ' <em>— Stand vom ' + datumKurz(s.datum) + '</em>' : ' <em>— kein Stand</em>') + '</span>';
      html += '<span class="e-summe schuld">' + (s ? euroOhneZeichen(s.betrag) : '—') + '</span>';
      html += '</button>';
    }
    html += '<div class="abschluss"><span>Summe</span><span class="betrag">' + euro(gesamt) + '</span></div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="knopf" onclick="oeffneKreditEditor(null)">Kredit anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
}

function oeffneKreditEditor(kreditId) {

  let html = '<div class="zettel-titel">' + (k ? 'Kredit' : 'Neuer Kredit') + '</div>';
  html += '<div class="feldgruppe"><label for="kr-name">Bezeichnung</label>';
  html += '<input class="feld" id="kr-name" type="text" autocomplete="off" value="' + (k ? escapeHtml(k.name) : '') + '" placeholder="z. B. Rahmenkredit"></div>';

    html += '<div class="feldgruppe"><label for="kr-stand">Heutiger Stand in Euro</label>';
    html += '<input class="feld betrag" id="kr-stand" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>';
  }
  html += '<div class="knopfzeile">';
  if (k) {
    html += '<button type="button" class="leise rot" id="kr-loeschen" onclick="kreditLoeschenBestaetigen(\'' + k.id + '\')">Löschen</button>';
  } else {
    html += '<button type="button" class="leise" onclick="oeffneSchulden()">Abbrechen</button>';
  }
  html += '<button type="button" class="knopf primaer" onclick="speichereKredit(' + (k ? '\'' + k.id + '\'' : 'null') + ')">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('kr-name').focus();
}

function speichereKredit(kreditId) {
  const name = document.getElementById('kr-name').value.trim();
  if (!name) { document.getElementById('kr-name').focus(); return; }
  if (kreditId) {
    const k = daten.kredite.find(x => x.id === kreditId);
    if (k) k.name = name;
  } else {
    const feld = document.getElementById('kr-stand');
    const stand = parseBetrag(feld.value);
    if (!(stand >= 0)) { feld.focus(); return; }
    daten.kredite.push({
      id: neueId('d'),
      name: name,
      staende: [{ datum: heuteISO(), betrag: stand }]
    });
  }
  speichere();
  oeffneSchulden();
  zeigeQuittung('Verbucht.');
}

function kreditLoeschenBestaetigen(kreditId) {
  const knopf = document.getElementById('kr-loeschen');
  if (!knopf) return;
  if (knopf.dataset.bereit === '1') {
    const i = daten.kredite.findIndex(x => x.id === kreditId);
    if (i >= 0) daten.kredite.splice(i, 1);
    speichere();
    oeffneSchulden();
    zeigeQuittung('Kredit gelöscht.');
  } else {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'Wirklich? Alle Stände entfallen.';
  }
}

function oeffneKreditDetail(kreditId) {
  const k = daten.kredite.find(x => x.id === kreditId);
  if (!k) return;
  const staende = (k.staende || []).slice().sort((a, b) => b.datum.localeCompare(a.datum));
  const s = letzterStand(k);
  const erster = (k.staende || []).slice().sort((a, b) => a.datum.localeCompare(b.datum))[0];

  let html = '<div class="zettel-titel">' + escapeHtml(k.name) + '</div>';
  html += '<section class="saldo-kopf" style="padding-top:0">';
  html += '<div class="zettel">Stand</div>';
  html += '<div class="saldo-betrag">' + (s ? euro(s.betrag) : '—') + '</div>';
  if (erster && s && erster !== s) {
    const ab = Math.round((erster.betrag - s.betrag) * 100) / 100;
    if (ab > 0) html += '<div class="frei">abgetragen ' + euro(ab) + ' seit ' + datumKurz(erster.datum) + '</div>';
    else if (ab < 0) html += '<div class="frei neutral">um ' + euro(-ab) + ' höher als am ' + datumKurz(erster.datum) + '</div>';
  }
  html += '</section>';

  html += '<div class="feldgruppe" style="margin-top:16px"><label for="kd-stand">Neuen Stand eintragen</label>';
  html += '<input class="feld betrag" id="kd-stand" type="text" inputmode="decimal" autocomplete="off" placeholder="0,00"></div>';
  html += '<div class="knopfzeile" style="justify-content:flex-end;margin-top:0">';
  html += '<button type="button" class="knopf primaer" onclick="erfasseStand(\'' + k.id + '\')">Eintragen</button>';
  html += '</div>';

  html += '<div class="buchtitel" style="margin-top:18px">Erfasste Stände</div>';
  if (staende.length === 0) {
    html += '<p class="hinweistext" style="text-align:center">Noch kein Stand erfasst.</p>';
  } else {
    html += '<div class="eintragsliste">';
    for (const st of staende.slice(0, 24)) {
      html += '<div class="eintragszeile">';
      html += '<span class="e-datum">' + datumLang(st.datum) + '</span>';
      html += '<span class="e-betrag">' + euro(st.betrag) + '</span>';
      html += '<button type="button" onclick="streicheStand(\'' + k.id + '\', \'' + st.datum + '\', this)">streichen</button>';
      html += '</div>';
    }
    html += '</div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneKreditEditor(\'' + k.id + '\')">Umbenennen</button>';
  html += '<button type="button" class="leise" onclick="oeffneSchulden()">Zurück</button>';
  html += '</div>';
  oeffneZettel(html);
}

function erfasseStand(kreditId) {
  const k = daten.kredite.find(x => x.id === kreditId);
  if (!k) return;
  const feld = document.getElementById('kd-stand');
  const betrag = parseBetrag(feld.value);
  if (!(betrag >= 0)) { feld.focus(); return; }
  const heute = heuteISO();
  if (!k.staende) k.staende = [];
  const vorhanden = k.staende.find(s => s.datum === heute);
  if (vorhanden) vorhanden.betrag = betrag;
  else k.staende.push({ datum: heute, betrag: betrag });
  speichere();
  oeffneKreditDetail(kreditId);
  zeigeQuittung('Verbucht.');
}

function streicheStand(kreditId, datum, knopf) {
  if (knopf.dataset.bereit !== '1') {
    knopf.dataset.bereit = '1';
    knopf.textContent = 'wirklich streichen?';
    knopf.classList.add('bestaetigen');
    return;
  }
  const k = daten.kredite.find(x => x.id === kreditId);
  if (k) {
    const i = k.staende.findIndex(s => s.datum === datum);
    if (i >= 0) k.staende.splice(i, 1);
    speichere();
  }
  oeffneKreditDetail(kreditId);
  zeigeQuittung('Stand gestrichen.');
}

/* ── Haushaltskonto-Planung ── */

function haushaltsPosten() {
  return ausgabePosten().filter(p => (p.konto || 'haushalt') === 'haushalt');
}

function naechstesBlatt() {
  let [j, m] = aktuellesBlatt().split('-').map(Number);
  m++;
  if (m > 12) { m = 1; j++; }
  return j + '-' + String(m).padStart(2, '0');
}

function oeffnePlanung() {
  const posten = haushaltsPosten();
  const summeBudgets = posten.reduce((s, p) => s + (p.monatsbudget || 0), 0);
  const plan = daten.settings.planung || {};
  const restbestand = typeof plan.restbestand === 'number' ? plan.restbestand : null;
  const korrektur = typeof plan.korrektur === 'number' ? plan.korrektur : 0;
  const vorschlag = Math.round((summeBudgets - (restbestand || 0) + korrektur) * 100) / 100;

  let html = '<div class="zettel-titel">Haushaltskonto</div>';

  if (posten.length === 0) {
    html += '<p class="vermerk">Kein Posten läuft über das Haushaltskonto.</p>';
    html += '<p class="hinweistext">Im Posten-Detail lässt sich je Posten festlegen, ob er über das Haushalts- oder das Girokonto läuft.</p>';
    html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button></div>';
    oeffneZettel(html);
    return;
  }

  html += '<p class="hinweistext">Vorschlag für den Beginn von <b>' + escapeHtml(blattNameLang(naechstesBlatt())) + '</b>. Jede Position einzeln:</p>';

  /* Aufstellung — vollständig transparent (F6.2) */
  html += '<div class="spaltenkopf"><span>Position</span><span></span><span>Betrag</span></div>';
  for (const p of posten) {
    html += '<div class="plan-zeile"><span class="p-name">' + escapeHtml(p.name) + '</span>';
    html += '<span class="p-betrag">' + euroOhneZeichen(p.monatsbudget || 0) + '</span></div>';
  }
  html += '<div class="plan-zwischensumme"><span>Summe der Posten</span><span class="p-betrag">' + euroOhneZeichen(summeBudgets) + '</span></div>';

  html += '<div class="plan-zeile abzug"><span class="p-name">abzüglich Restbestand auf dem Konto</span>';
  html += '<span class="p-betrag">' + (restbestand === null ? '—' : '− ' + euroOhneZeichen(restbestand)) + '</span></div>';
  if (korrektur !== 0) {
    html += '<div class="plan-zeile"><span class="p-name">' + escapeHtml(plan.korrekturGrund || 'Korrektur') + '</span>';
    html += '<span class="p-betrag">' + (korrektur > 0 ? '+ ' : '− ') + euroOhneZeichen(Math.abs(korrektur)) + '</span></div>';
  }

  html += '<div class="abschluss"><span>Zu überweisen</span><span class="betrag">' + euro(Math.max(vorschlag, 0)) + '</span></div>';

  if (restbestand === null) {
    html += '<p class="vermerk">Ohne Restbestand gerechnet — der Vorschlag entspricht der vollen Summe.</p>';
  } else if (plan.stand) {
    html += '<p class="vermerk">Restbestand eingetragen am ' + datumLang(plan.stand) + '.</p>';
  }

  html += baueGegenueberstellung();

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneRestbestand()">Restbestand eintragen</button>';
  html += '<button type="button" class="leise" onclick="oeffneKorrektur()">Korrektur</button>';
  html += '</div>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button></div>';
  oeffneZettel(html);
}

function einnahmeSummeBlatt(blatt) {
  let summe = 0;
  for (const b of daten.buchungen) {
    if (b.betrag > 0 && b.kategorieId
        && istEinnahmePosten(daten.kategorien.find(k => k.id === b.kategorieId))
        && blattVon(b.datum) === blatt) {
      summe += b.betrag;
    }
  }
  return Math.round(summe * 100) / 100;
}

function baueGegenueberstellung() {
  const haushalt = haushaltsPosten().reduce((s, p) => s + (p.monatsbudget || 0), 0);
  const giro = ausgabePosten().filter(p => (p.konto || 'haushalt') === 'giro')
    .reduce((s, p) => s + (p.monatsbudget || 0), 0);
  const gesamt = Math.round((haushalt + giro) * 100) / 100;

  const blatt = aktuellesBlatt();
  const einnahmen = einnahmeSummeBlatt(blatt);

  let html = '<div class="buchtitel" style="margin-top:24px">Gegenüberstellung</div>';

  if (gesamt === 0) {
    html += '<p class="hinweistext" style="text-align:center">Noch kein Posten mit Soll-Betrag angelegt.</p>';
    return html;
  }

  html += '<div class="plan-zeile"><span class="p-name">Posten · Haushaltskonto</span>'
       + '<span class="p-betrag">' + euroOhneZeichen(haushalt) + '</span></div>';
  html += '<div class="plan-zeile"><span class="p-name">Posten · Girokonto</span>'
       + '<span class="p-betrag">' + euroOhneZeichen(giro) + '</span></div>';
  html += '<div class="plan-zwischensumme"><span>Summe aller Posten</span>'
       + '<span class="p-betrag">' + euroOhneZeichen(gesamt) + '</span></div>';

  if (einnahmen === 0) {
    html += '<div class="plan-zeile abzug"><span class="p-name">Einnahmen · Blatt '
         + escapeHtml(blattName(blatt)) + '</span><span class="p-betrag">—</span></div>';
    html += '<p class="rueck-fuss">Für dieses Blatt ist noch keine Einnahme verzeichnet. Sobald der Gehaltseingang eingelesen und einem Einnahme-Posten zugeordnet ist, erscheint hier die Gegenüberstellung.</p>';
    return html;
  }

  html += '<div class="plan-zeile"><span class="p-name">Einnahmen · Blatt '
       + escapeHtml(blattName(blatt)) + '</span>'
       + '<span class="p-betrag">' + euroOhneZeichen(einnahmen) + '</span></div>';

  const rest = Math.round((einnahmen - gesamt) * 100) / 100;
  if (rest >= 0) {
    html += '<div class="abschluss"><span>Bleibt</span><span class="betrag">' + euro(rest) + '</span></div>';
  } else {
    html += '<div class="abschluss ueberzogen"><span>Posten übersteigen die Einnahmen um</span>'
         + '<span class="betrag">' + euro(-rest) + '</span></div>';
  }

  /* Die beiden vorigen Blätter zur Einordnung — ein einzelnes Blatt kann täuschen. */
  const vorige = [];
  for (let i = 1; i <= 2; i++) {
    const bl = monatPlus(blatt, -i);
    const e = einnahmeSummeBlatt(bl);
    if (e > 0) vorige.push({ blatt: bl, summe: e });
  }
  if (vorige.length > 0) {
    html += '<p class="rueck-fuss">Zum Vergleich: '
         + vorige.map(v => escapeHtml(blattName(v.blatt)) + ' ' + euro(v.summe)).join(' · ') + '.</p>';
  }
  html += '<p class="rueck-fuss">Einnahmen des laufenden Blatts. Die Soll-Beträge gelten je Blatt; nur wenn ihre Summe unter den Einnahmen bleibt, trägt das Einkommen den Plan.</p>';
  return html;
}

function oeffneRestbestand() {
  const plan = daten.settings.planung || {};
  let html = '<div class="zettel-titel">Restbestand</div>';
  html += '<p class="hinweistext">Der Betrag, der am Monatsende noch auf dem Haushaltskonto liegt. Er wird vom Überweisungsvorschlag abgezogen.</p>';
  html += '<div class="feldgruppe"><label for="pl-rest">Auf dem Konto</label>';
  html += '<input class="feld betrag" id="pl-rest" type="text" inputmode="decimal" autocomplete="off" value="'
       + (typeof plan.restbestand === 'number' ? euroOhneZeichen(plan.restbestand) : '') + '" placeholder="0,00"></div>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffnePlanung()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="speichereRestbestand()">Übernehmen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('pl-rest').focus();
}

function speichereRestbestand() {
  const feld = document.getElementById('pl-rest');
  const wert = parseBetrag(feld.value);
  if (!(wert >= 0)) { feld.focus(); return; }
  if (!daten.settings.planung) daten.settings.planung = {};
  daten.settings.planung.restbestand = wert;
  daten.settings.planung.stand = heuteISO();
  speichere();
  oeffnePlanung();
  zeigeQuittung('Verbucht.');
}

function oeffneKorrektur() {
  const plan = daten.settings.planung || {};
  let html = '<div class="zettel-titel">Korrektur</div>';
  html += '<p class="hinweistext">Ein einmaliger Zu- oder Abschlag, etwa für eine bevorstehende größere Anschaffung. Negative Beträge mit Minuszeichen.</p>';
  html += '<div class="feldgruppe"><label for="pl-korr">Betrag</label>';
  html += '<input class="feld betrag" id="pl-korr" type="text" inputmode="text" autocomplete="off" value="'
       + (plan.korrektur ? euroOhneZeichen(plan.korrektur) : '') + '" placeholder="0,00"></div>';
  html += '<div class="feldgruppe"><label for="pl-grund">Bezeichnung — freiwillig</label>';
  html += '<input class="feld" id="pl-grund" type="text" autocomplete="off" value="' + escapeHtml(plan.korrekturGrund || '') + '" placeholder="z. B. Urlaubskasse"></div>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="entferneKorrektur()">Entfernen</button>';
  html += '<button type="button" class="knopf primaer" onclick="speichereKorrektur()">Übernehmen</button>';
  html += '</div>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffnePlanung()">Abbrechen</button></div>';
  oeffneZettel(html);
  document.getElementById('pl-korr').focus();
}

function speichereKorrektur() {
  const wert = parseBetrag(document.getElementById('pl-korr').value);
  if (!isFinite(wert)) { document.getElementById('pl-korr').focus(); return; }
  if (!daten.settings.planung) daten.settings.planung = {};
  daten.settings.planung.korrektur = wert;
  daten.settings.planung.korrekturGrund = document.getElementById('pl-grund').value.trim();
  speichere();
  oeffnePlanung();
  zeigeQuittung('Verbucht.');
}

function entferneKorrektur() {
  if (daten.settings.planung) {
    daten.settings.planung.korrektur = 0;
    daten.settings.planung.korrekturGrund = '';
    speichere();
  }
  oeffnePlanung();
  zeigeQuittung('Korrektur entfernt.');
}

/* ── Rückschau ──
   Grundsatz (Lastenheft F10.4): Diese Ansicht bewertet nicht. Keine Ziele,
   keine Schwellen, keine Farbcodierung nach Kennzahlen, keine Wertungswörter.
   Sie zeigt Zusammenhänge und überlässt die Deutung dem Leser.            */

function ausgabenEintraege(blatt) {
  // Grundgesamtheit: Ausgaben-Einträge (Buchungen + Bargeld) des Zeitraums.
  const ausB = daten.buchungen.filter(b =>
    b.betrag < 0 && b.kategorieId && b.kategorieId !== ABHEBUNG_ID
    && istAusgabePosten(daten.kategorien.find(k => k.id === b.kategorieId))
    && (!blatt || blattVon(b.datum) === blatt));
  const ausC = daten.bargeld.bewegungen.filter(c =>
    c.betrag < 0 && c.kategorieId
    && (!blatt || blattVon(c.datum) === blatt));
  return ausB.concat(ausC);
}

function rueckschauZahlen(blatt) {
  const alle = ausgabenEintraege(blatt);
  const mitVermerk = alle.filter(e => e.beweggrundId);
  const summe = e => Math.abs(e.betrag);

  const geplant = mitVermerk.filter(e => e.geplant === true);
  const ungeplant = mitVermerk.filter(e => e.geplant === false);

  const jeGrund = {};
  for (const e of mitVermerk) {
    if (!jeGrund[e.beweggrundId]) jeGrund[e.beweggrundId] = { anzahl: 0, summe: 0 };
    jeGrund[e.beweggrundId].anzahl++;
    jeGrund[e.beweggrundId].summe += summe(e);
  }

  return {
    gesamt: alle.length,
    mitVermerk: mitVermerk.length,
    abdeckung: alle.length > 0 ? mitVermerk.length / alle.length : 0,
    summeAlle: alle.reduce((s, e) => s + summe(e), 0),
    summeMitVermerk: mitVermerk.reduce((s, e) => s + summe(e), 0),
    geplantAnzahl: geplant.length,
    geplantSumme: geplant.reduce((s, e) => s + summe(e), 0),
    ungeplantAnzahl: ungeplant.length,
    ungeplantSumme: ungeplant.reduce((s, e) => s + summe(e), 0),
    jeGrund: jeGrund,
    eintraege: mitVermerk
  };
}

function anteilsLinie(anteil) {
  // Tintenlinie als Anteilsstrich — dieselbe Sprache wie im Hauptbuch.
  const w = Math.max(0, Math.min(1, anteil)) * 100;
  return '<div class="tintenlinie ruecklinie"><i style="--w:' + w.toFixed(1) + '%"></i></div>';
}

function prozentText(anteil) {
  return (anteil * 100).toFixed(0) + ' %';
}

let rueckschauBlatt = null; // null = alle Blätter

function oeffneRueckschau() {
  const blatt = rueckschauBlatt;
  const z = rueckschauZahlen(blatt);
  const zeitraum = blatt ? 'Blatt ' + blattName(blatt) : 'alle Blätter';

  let html = '<div class="zettel-titel">Rückschau</div>';

  /* Zeitraumwahl */
  html += '<div class="streifen-reihe" style="margin-bottom:12px">';
  html += '<button type="button" class="stempel' + (blatt === null ? ' gewaehlt' : '') + '" onclick="waehleRueckschauBlatt(null)">alle Blätter</button>';
  for (const bl of alleBlaetter().slice(0, 12)) {
    html += '<button type="button" class="stempel' + (blatt === bl ? ' gewaehlt' : '') + '" onclick="waehleRueckschauBlatt(\'' + bl + '\')">' + escapeHtml(blattName(bl)) + '</button>';
  }
  html += '</div>';

  if (z.gesamt === 0) {
    html += '<p class="vermerk">Für ' + escapeHtml(zeitraum) + ' ist kein Eintrag verzeichnet.</p>';
    html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button></div>';
    oeffneZettel(html);
    return;
  }

  /* Abdeckung — steht immer zuerst (F10.3) */
  html += '<div class="buchtitel">Abdeckung</div>';
  html += '<p class="rueck-satz">Von <b>' + z.gesamt + '</b> ' + (z.gesamt === 1 ? 'Eintrag trägt' : 'Einträgen tragen') + ' <b>'
       + z.mitVermerk + '</b> einen Vermerk.</p>';
  html += anteilsLinie(z.abdeckung);
  html += '<p class="rueck-fuss">' + prozentText(z.abdeckung) + ' — alle folgenden Angaben beziehen sich auf diese ' + z.mitVermerk + ' Einträge.</p>';

  if (z.mitVermerk === 0) {
    html += '<p class="vermerk">Ohne Vermerke lässt sich nichts gegenüberstellen.</p>';
    html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button></div>';
    oeffneZettel(html);
    return;
  }

  /* Geplant / Ungeplant */
  html += '<div class="buchtitel" style="margin-top:20px">Geplant und ungeplant</div>';
  html += '<div class="spaltenkopf"><span>Kennzeichen</span><span>Anzahl</span><span>Summe</span></div>';
  const anteilGeplant = z.mitVermerk > 0 ? z.geplantAnzahl / z.mitVermerk : 0;
  html += '<div class="rueck-zeile"><span class="r-name">geplant</span>'
       + '<span class="r-anzahl">' + z.geplantAnzahl + '</span>'
       + '<span class="r-summe">' + euroOhneZeichen(z.geplantSumme) + '</span>'
       + anteilsLinie(anteilGeplant)
       + '<span class="r-rest">' + prozentText(anteilGeplant) + ' der vermerkten Einträge</span></div>';
  const anteilUngeplant = z.mitVermerk > 0 ? z.ungeplantAnzahl / z.mitVermerk : 0;
  html += '<div class="rueck-zeile"><span class="r-name">ungeplant</span>'
       + '<span class="r-anzahl">' + z.ungeplantAnzahl + '</span>'
       + '<span class="r-summe">' + euroOhneZeichen(z.ungeplantSumme) + '</span>'
       + anteilsLinie(anteilUngeplant)
       + '<span class="r-rest">' + prozentText(anteilUngeplant) + ' der vermerkten Einträge</span></div>';

  /* Je Beweggrund */
  html += '<div class="buchtitel" style="margin-top:20px">Nach Beweggrund</div>';
  html += '<div class="spaltenkopf"><span>Beweggrund</span><span>Anzahl</span><span>Summe</span></div>';
  const gruende = Object.keys(z.jeGrund)
    .map(id => ({ id: id, name: (beweggrund(id) || {}).name || 'Unbekannt',
                  anzahl: z.jeGrund[id].anzahl, summe: z.jeGrund[id].summe }))
    .sort((a, b) => b.anzahl - a.anzahl || b.summe - a.summe);
  for (const g of gruende) {
    const anteil = g.anzahl / z.mitVermerk;
    html += '<div class="rueck-zeile"><span class="r-name">' + escapeHtml(g.name) + '</span>'
         + '<span class="r-anzahl">' + g.anzahl + '</span>'
         + '<span class="r-summe">' + euroOhneZeichen(g.summe) + '</span>'
         + anteilsLinie(anteil)
         + '<span class="r-rest">' + prozentText(anteil) + '</span></div>';
  }
  html += '<div class="abschluss"><span>Summe der vermerkten Einträge</span><span class="betrag">' + euro(z.summeMitVermerk) + '</span></div>';

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button>';
  html += '<button type="button" class="leise" onclick="oeffneKreuzbetrachtung()">Beweggrund × Posten</button>';
  html += '</div>';
  if (alleBlaetter().length > 1) {
    html += '<div class="korb-fuss"><button type="button" onclick="oeffneVerlaufUeberBlaetter()">Entwicklung über die Blätter</button></div>';
  }
  oeffneZettel(html);
}

function waehleRueckschauBlatt(blatt) {
  rueckschauBlatt = blatt;
  oeffneRueckschau();
}

function oeffneKreuzbetrachtung() {
  const blatt = rueckschauBlatt;
  const z = rueckschauZahlen(blatt);
  const zeitraum = blatt ? 'Blatt ' + blattName(blatt) : 'alle Blätter';

  /* Kreuztabelle Beweggrund × Posten, nach Posten gegliedert */
  const jePosten = {};
  for (const e of z.eintraege) {
    if (!jePosten[e.kategorieId]) jePosten[e.kategorieId] = { anzahl: 0, summe: 0, gruende: {} };
    const p = jePosten[e.kategorieId];
    p.anzahl++;
    p.summe += Math.abs(e.betrag);
    if (!p.gruende[e.beweggrundId]) p.gruende[e.beweggrundId] = { anzahl: 0, summe: 0 };
    p.gruende[e.beweggrundId].anzahl++;
    p.gruende[e.beweggrundId].summe += Math.abs(e.betrag);
  }

  let html = '<div class="zettel-titel">Beweggrund × Posten</div>';
  html += '<p class="rueck-fuss" style="margin-bottom:14px">' + escapeHtml(zeitraum) + ' — ' + z.mitVermerk
       + ' vermerkte von ' + z.gesamt + ' Einträgen (' + prozentText(z.abdeckung) + ').</p>';

  const postenIds = Object.keys(jePosten).sort((a, b) => jePosten[b].summe - jePosten[a].summe);
  if (postenIds.length === 0) {
    html += '<p class="vermerk">Kein vermerkter Eintrag im Zeitraum.</p>';
  } else {
    for (const pid of postenIds) {
      const p = jePosten[pid];
      html += '<div class="buchtitel" style="margin-top:16px">' + escapeHtml(postenName(pid)) + '</div>';
      html += '<div class="spaltenkopf"><span>Beweggrund</span><span>Anzahl</span><span>Summe</span></div>';
      const gruende = Object.keys(p.gruende)
        .map(id => ({ name: (beweggrund(id) || {}).name || 'Unbekannt',
                      anzahl: p.gruende[id].anzahl, summe: p.gruende[id].summe }))
        .sort((a, b) => b.summe - a.summe);
      for (const g of gruende) {
        html += '<div class="rueck-zeile schmal"><span class="r-name">' + escapeHtml(g.name) + '</span>'
             + '<span class="r-anzahl">' + g.anzahl + '</span>'
             + '<span class="r-summe">' + euroOhneZeichen(g.summe) + '</span>'
             + anteilsLinie(g.summe / p.summe) + '</div>';
      }
      html += '<div class="plan-zwischensumme"><span>' + p.anzahl + (p.anzahl === 1 ? ' Eintrag' : ' Einträge')
           + '</span><span class="p-betrag">' + euroOhneZeichen(p.summe) + '</span></div>';
    }
  }

  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneRueckschau()">Zurück</button></div>';
  oeffneZettel(html);
}

function oeffneVerlaufUeberBlaetter() {
  const blaetter = alleBlaetter().slice(0, 12).reverse();
  let html = '<div class="zettel-titel">Entwicklung</div>';
  html += '<p class="rueck-fuss" style="margin-bottom:14px">Je Blatt: vermerkte Einträge und ihr Anteil geplanter Einträge.</p>';
  html += '<div class="spaltenkopf"><span>Blatt</span><span>Vermerkt</span><span>Geplant</span></div>';

  for (const bl of blaetter) {
    const z = rueckschauZahlen(bl);
    if (z.gesamt === 0) continue;
    const anteilGeplant = z.mitVermerk > 0 ? z.geplantAnzahl / z.mitVermerk : 0;
    html += '<div class="rueck-zeile"><span class="r-name">' + escapeHtml(blattNameLang(bl)) + '</span>';
    html += '<span class="r-anzahl">' + z.mitVermerk + '/' + z.gesamt + '</span>';
    html += '<span class="r-summe">' + (z.mitVermerk > 0 ? z.geplantAnzahl + '/' + z.mitVermerk : '—') + '</span>';
    if (z.mitVermerk > 0) {
      html += anteilsLinie(anteilGeplant);
      html += '<span class="r-rest">' + prozentText(anteilGeplant) + ' geplant · Abdeckung ' + prozentText(z.abdeckung) + '</span>';
    } else {
      html += '<span class="r-rest">kein Vermerk verzeichnet</span>';
    }
    html += '</div>';
  }

  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneRueckschau()">Zurück</button></div>';
  oeffneZettel(html);
}

function oeffneBlattwechsel() {
  const modus = daten.settings.blattModus || 'kalender';
  const posten = daten.kategorien.filter(k => istEinnahmePosten(k) && !k.archiviert)
    .sort((a, b) => (a.reihenfolge || 0) - (b.reihenfolge || 0) || a.name.localeCompare(b.name, 'de'));
  const gewaehlt = daten.settings.gehaltPostenId;

  let html = '<div class="zettel-titel">Blattwechsel</div>';
  html += '<p class="hinweistext">Wann beginnt ein neues Blatt?</p>';
  html += '<div class="wahl2" style="margin-bottom:14px">';
  html += '<button type="button" class="' + (modus === 'kalender' ? 'gewaehlt' : '') + '" onclick="setzeBlattModus(\'kalender\')">Monatserster</button>';
  html += '<button type="button" class="' + (modus === 'gehalt' ? 'gewaehlt' : '') + '" onclick="setzeBlattModus(\'gehalt\')">Gehaltseingang</button>';
  html += '</div>';

  if (modus === 'gehalt') {
    html += '<div class="buchtitel">Gehalts-Posten</div>';
    html += '<p class="hinweistext">Jeder Eingang auf diesem Posten eröffnet ein neues Blatt. Ohne Zuordnung rechnet die App mit dem letzten Werktag des Vormonats.</p>';
    if (posten.length === 0) {
      html += '<p class="vermerk">Noch kein Einnahme-Posten angelegt.</p>';
    } else {
      html += '<div class="postenwahl">';
      for (const p of posten) {
        html += '<button type="button" class="wahl-posten" onclick="setzeGehaltPosten(\'' + p.id + '\')">'
             + '<span class="w-name">' + escapeHtml(p.name) + '</span>'
             + '<span class="w-rest">' + (gewaehlt === p.id ? 'gewählt' : '') + '</span></button>';
      }
      html += '<button type="button" class="wahl-posten" onclick="setzeGehaltPosten(null)">'
           + '<span class="w-name">Keiner — nur letzter Werktag</span>'
           + '<span class="w-rest">' + (!gewaehlt ? 'gewählt' : '') + '</span></button>';
      html += '</div>';
    }

    const stichtage = gehaltsStichtage();
    html += '<div class="buchtitel" style="margin-top:18px">Erkannte Stichtage</div>';
    if (stichtage.length === 0) {
      html += '<p class="hinweistext" style="text-align:center">Noch kein Gehaltseingang verzeichnet — die App rechnet mit dem letzten Werktag.</p>';
    } else {
      html += '<p class="hinweistext">' + stichtage.length + (stichtage.length === 1 ? ' Eingang' : ' Eingänge') + ' verzeichnet.</p>';
    }
  }

  /* Zur Kontrolle: die tatsächlichen Grenzen der letzten Blätter */
  html += '<div class="buchtitel" style="margin-top:18px">Blätter</div>';
  html += '<div class="spaltenkopf"><span>Blatt</span><span></span><span>beginnt am</span></div>';
  const g = blattGrenzen();
  const sichtbar = g.reihe.filter(m => m <= monatPlus(aktuellesBlatt(), 1)).slice(-8);
  for (const m of sichtbar) {
    const echt = (daten.settings.blattModus === 'gehalt')
      && gehaltsStichtage().indexOf(g.grenze[m]) >= 0;
    html += '<div class="plan-zeile"><span class="p-name">' + escapeHtml(blattNameLang(m))
         + (m === aktuellesBlatt() ? ' <em style="font-style:italic;font-size:0.78rem;color:var(--tinte-blass)">— aktuell</em>' : '')
         + '</span><span class="p-betrag">' + datumKurz(g.grenze[m])
         + (echt ? '' : ' <em style="font-style:italic;font-size:0.72rem;color:var(--tinte-blass)">gerechnet</em>')
         + '</span></div>';
  }
  html += '<p class="rueck-fuss">„Gerechnet" heißt: ohne verzeichneten Gehaltseingang, ersatzweise letzter Werktag des Vormonats.</p>';

  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneVerwaltung()">Zurück</button></div>';
  oeffneZettel(html);
