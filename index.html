/* ── CSV-Einlesen ── */

let importZustand = null; // { konto, kopfzellen, zeilen, sep, zuordnung }

function oeffneEinlesen() {
  importZustand = { konto: 'giro' };
  let html = '<div class="zettel-titel">Blatt einlesen</div>';
  html += '<div class="feldgruppe"><label>Konto</label><div class="wahl2">';
  html += '<button type="button" id="ei-giro" class="gewaehlt" onclick="waehleImportKonto(\'giro\')">Girokonto</button>';
  html += '<button type="button" id="ei-haushalt" onclick="waehleImportKonto(\'haushalt\')">Haushaltskonto</button>';
  html += '</div></div>';
  html += '<p class="hinweistext">Die CSV-Datei aus dem Online-Banking wählen. Bereits Verzeichnetes wird erkannt und übersprungen.</p>';
  html += '<div class="knopfzeile" style="justify-content:center;margin-top:0">';
  html += '<label class="knopf primaer" style="display:inline-block">Datei wählen'
       + '<input type="file" accept=".csv,text/csv,text/plain" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden" onchange="leseCsvDatei(this)"></label>';
  html += '</div>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="schliesseZettel()">Abbrechen</button></div>';
  oeffneZettel(html);
}

function waehleImportKonto(konto) {
  if (!importZustand) importZustand = {};
  importZustand.konto = konto;
  const g = document.getElementById('ei-giro'), h = document.getElementById('ei-haushalt');
  if (g && h) {
    g.classList.toggle('gewaehlt', konto === 'giro');
    h.classList.toggle('gewaehlt', konto === 'haushalt');
  }
}

function leseCsvDatei(input) {
  const datei = input.files && input.files[0];
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    let text;
    try {
      text = new TextDecoder('utf-8', { fatal: true }).decode(leser.result);
    } catch (e) {
      text = new TextDecoder('iso-8859-1').decode(leser.result);
    }
    verarbeiteCsvText(text);
  };
  leser.readAsArrayBuffer(datei);
}

function teileCsvZeile(zeile, sep) {
  // Einfacher Teiler mit Anführungszeichen-Unterstützung ("...";"...")
  const zellen = [];
  let aktuell = '', inAnf = false;
  for (let i = 0; i < zeile.length; i++) {
    const z = zeile[i];
    if (z === '"') {
      if (inAnf && zeile[i + 1] === '"') { aktuell += '"'; i++; }
      else inAnf = !inAnf;
    } else if (z === sep && !inAnf) {
      zellen.push(aktuell); aktuell = '';
    } else {
      aktuell += z;
    }
  }
  zellen.push(aktuell);
  return zellen.map(s => s.trim());
}

function findeKopfzeile(zeilen, sep) {
  for (let i = 0; i < Math.min(zeilen.length, 40); i++) {
    const zellen = teileCsvZeile(zeilen[i], sep);
    if (zellen.length >= 3 && zellen.some(z => /betrag/i.test(z))) {
      return { index: i, zellen: zellen };
    }
  }
  return null;
}

function rateZuordnung(kopfzellen) {
  const finde = (regex, ausschluss) => {
    for (let i = 0; i < kopfzellen.length; i++) {
      if (regex.test(kopfzellen[i]) && !(ausschluss && ausschluss.test(kopfzellen[i]))) return i;
    }
    return null;
  };
  return {
    datum: finde(/^buchung$|^buchungstag$|datum/i, /wertstellung|valuta/i),
    betrag: finde(/betrag/i, /währung|waehrung/i),
    empfaenger: finde(/auftraggeber|empf|begünstigter|beguenstigter/i, null),
    zweck: finde(/verwendungszweck/i, null)
  };
}

function verarbeiteCsvText(text) {
  const zeilen = text.split(/\r?\n/);
  let sep = ';', kopf = findeKopfzeile(zeilen, ';');
  if (!kopf) { sep = ','; kopf = findeKopfzeile(zeilen, ','); }
  if (!kopf) {
    zeigeImportFehler('Keine Kopfzeile mit einer Betrag-Spalte gefunden. Ist es der Umsatz-Export der Bank?');
    return;
  }
  importZustand.sep = sep;
  importZustand.kopfzellen = kopf.zellen;
  importZustand.zeilen = zeilen.slice(kopf.index + 1).filter(z => z.trim() !== '');

  const gespeichert = daten.settings.importZuordnung[importZustand.konto];
  if (gespeichert && passtZuordnung(gespeichert, kopf.zellen)) {
    importZustand.zuordnung = gespeichert;
    fuehreImportDurch();
  } else {
    importZustand.zuordnung = rateZuordnung(kopf.zellen);
    zeigeZuordnung();
  }
}

function passtZuordnung(z, kopfzellen) {
  return z && Number.isInteger(z.datum) && Number.isInteger(z.betrag)
      && z.datum < kopfzellen.length && z.betrag < kopfzellen.length;
}

function zeigeImportFehler(text) {
  let html = '<div class="zettel-titel">Blatt einlesen</div>';
  html += '<p class="hinweistext" style="color:var(--siegellack)">' + escapeHtml(text) + '</p>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="oeffneEinlesen()">Zurück</button></div>';
  oeffneZettel(html);
}

/* Spaltenzuordnung (nur beim allerersten Import je Konto nötig) */

function zeigeZuordnung() {
  const felder = [
    ['datum', 'Datum', true],
    ['betrag', 'Betrag', true],
    ['empfaenger', 'Auftraggeber / Empfänger', false],
    ['zweck', 'Verwendungszweck', false]
  ];
  let html = '<div class="zettel-titel">Spalten zuordnen</div>';
  html += '<p class="hinweistext">Einmalige Zuordnung für dieses Konto — die App merkt sie sich. Erkannte Spalten sind vorbelegt.</p>';
  for (const [schluessel, name, pflicht] of felder) {
    html += '<div class="zuordnung-zeile"><div class="z-feld">' + name + (pflicht ? '' : ' — freiwillig') + '</div>';
    html += '<div class="streifen-reihe">';
    importZustand.kopfzellen.forEach((zelle, i) => {
      const gewaehlt = importZustand.zuordnung[schluessel] === i;
      html += '<button type="button" class="stempel' + (gewaehlt ? ' gewaehlt' : '') + '" onclick="setzeZuordnung(\'' + schluessel + '\', ' + i + ')">' + escapeHtml(zelle || '(leer)') + '</button>';
    });
    if (!pflicht) {
      const keine = importZustand.zuordnung[schluessel] === null;
      html += '<button type="button" class="stempel' + (keine ? ' gewaehlt' : '') + '" onclick="setzeZuordnung(\'' + schluessel + '\', null)">keine</button>';
    }
    html += '</div></div>';
  }
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneEinlesen()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="bestaetigeZuordnung()">Stimmt so</button>';
  html += '</div>';
  oeffneZettel(html);
}

function setzeZuordnung(schluessel, index) {
  importZustand.zuordnung[schluessel] = index;
  zeigeZuordnung();
}

function bestaetigeZuordnung() {
  const z = importZustand.zuordnung;
  if (!Number.isInteger(z.datum) || !Number.isInteger(z.betrag)) {
    zeigeImportFehler('Datum und Betrag müssen zugeordnet sein.');
    return;
  }
  daten.settings.importZuordnung[importZustand.konto] = z;
  speichere();
  fuehreImportDurch();
}

/* Durchführung: Parsen, Duplikate, Übernahme */

function parseCsvDatum(s) {
  s = (s || '').trim();
  let m = s.match(/^(\d{2})\.(\d{2})\.(\d{4})$/);
  if (m) return m[3] + '-' + m[2] + '-' + m[1];
  m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (m) return s;
  return null;
}

function normalisiereText(s) {
  return (s || '').toLowerCase().replace(/\s+/g, ' ').trim();
}

function fuehreImportDurch() {
  const z = importZustand.zuordnung;
  const konto = importZustand.konto;
  const vorhandene = new Set(daten.buchungen.filter(b => b.hash).map(b => b.hash));
  const imDatei = {};
  let neu = 0, uebersprungen = 0, unlesbar = 0, automatisch = 0;

  for (const zeile of importZustand.zeilen) {
    const zellen = teileCsvZeile(zeile, importZustand.sep);
    const datum = parseCsvDatum(zellen[z.datum]);
    const betrag = parseBetrag(zellen[z.betrag] || '');
    if (!datum || !isFinite(betrag)) { unlesbar++; continue; }
    const empf = z.empfaenger !== null && z.empfaenger !== undefined ? (zellen[z.empfaenger] || '') : '';
    const zweck = z.zweck !== null && z.zweck !== undefined ? (zellen[z.zweck] || '') : '';
    const text = (empf && zweck) ? empf + ' · ' + zweck : (empf || zweck);

    const basis = konto + '|' + datum + '|' + betrag.toFixed(2) + '|' + normalisiereText(text);
    imDatei[basis] = (imDatei[basis] || 0) + 1;
    const schluessel = imDatei[basis] > 1 ? basis + '#' + imDatei[basis] : basis;

    if (vorhandene.has(schluessel)) { uebersprungen++; continue; }
    vorhandene.add(schluessel);

    // Regelanwendung: Treffer werden unmittelbar verbucht (bestätigte Entscheidung zu v0.4).
    let kategorieId = null, autoZugeordnet = false;
    const regel = findeRegel({ empfaenger: empf, zweck: zweck });
    if (regel) {
      const ziel = daten.kategorien.find(k => k.id === regel.kategorieId);
      const passt = regel.kategorieId === ABHEBUNG_ID
        ? betrag < 0
        : (betrag < 0 ? (!ziel || istAusgabePosten(ziel)) : (ziel && istEinnahmePosten(ziel)));
      if (passt) { kategorieId = regel.kategorieId; autoZugeordnet = true; automatisch++; }
    }

    daten.buchungen.push({
      id: neueId('b'),
      datum: datum,
      betrag: betrag,
      text: text,
      empfaenger: empf,
      zweck: zweck,
      konto: konto,
      kategorieId: kategorieId,
      quelle: 'csv',
      autoZugeordnet: autoZugeordnet,
      hash: schluessel,
      beweggrundId: null,
      geplant: null,
      wunschId: null
    });
    neu++;
  }

  speichere();
  render();

  let html = '<div class="zettel-titel">Eingelesen</div>';
  html += '<p class="hinweistext" style="text-align:center">' + importZustand.zeilen.length + ' Zeilen gelesen — <b>' + neu + ' neu verzeichnet</b>, '
       + uebersprungen + ' bereits vorhanden' + (unlesbar > 0 ? ', ' + unlesbar + ' unlesbar' : '') + '.'
       + (automatisch > 0 ? '<br>Davon <b>' + automatisch + '</b> nach Regel selbsttätig zugeordnet.' : '') + '</p>';
  const offen = korbListe().length;
  if (offen > 0) {
    html += '<div class="knopfzeile" style="justify-content:center;margin-top:6px">';
    html += '<button type="button" class="knopf primaer" onclick="oeffneKorb()">Eingangskorb öffnen (' + offen + ')</button>';
    html += '</div>';
  } else {
    html += '<p class="vermerk">Der Korb ist leer. Geprüft und für richtig befunden.</p>';
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="schliesseZettel()">Schließen</button></div>';
  oeffneZettel(html);
}

/* ── Eingangskorb (Weg C) ── */

let korbBeweggrund = null;
let korbUebersprungen = new Set();
let regelVorschlagOffen = null;

function regelVorschlagAnnehmen() {
  const v = regelVorschlagOffen;
  regelVorschlagOffen = null;
  if (!v) return;
  const neueRegel = {
    id: neueId('r'),
    feld: 'kombi',
    empfaenger: v.empfaenger || '',
    zweck: v.zweck || '',
    kategorieId: v.kategorieId,
    aktiv: true
  };
  daten.regeln.push(neueRegel);
  // Regel sofort auf den übrigen Korb anwenden.
  let getroffen = 0;
  for (const b of korbListe()) {
    if (b.betrag >= 0) continue;
    const r = findeRegel(b);
    if (r && r.id === neueRegel.id) {
      b.kategorieId = r.kategorieId;
      b.autoZugeordnet = true;
      getroffen++;
    }
  }
  speichere();
  zeigeQuittung(getroffen > 0
    ? 'Regel angelegt — ' + getroffen + (getroffen === 1 ? ' weiterer Eintrag' : ' weitere Einträge') + ' zugeordnet.'
    : 'Regel angelegt.');
  oeffneKorb();
}

function regelVorschlagVerwerfen() {
  regelVorschlagOffen = null;
  oeffneKorb();
}

function korbListe() {
  return daten.buchungen.filter(b => !b.kategorieId)
    .sort((a, b) => a.datum.localeCompare(b.datum) || a.id.localeCompare(b.id));
}

function naechsteKorbBuchung() {
  const liste = korbListe();
  return liste.find(b => !korbUebersprungen.has(b.id)) || liste[0] || null;
}

function oeffneKorb() {
  const b = naechsteKorbBuchung();
  if (!b) {
    schliesseZettel();
    render();
    zeigeQuittung('Der Korb ist leer.');
    return;
  }
  const gesamt = korbListe().length;
  const posten = ausgabePosten();
  const blatt = blattVon(b.datum);
  const teile = buchungTeile(b);
  const empf = teile.empfaenger;
  const zweck = teile.zweck;
  const istEinnahme = b.betrag > 0;

  let html = '<div class="zettel-titel">Eingangskorb</div>';
  if (regelVorschlagOffen) {
    html += '<div class="regelvorschlag">';
    html += '<span>Künftig immer <b>' + escapeHtml(regelBeschreibung(regelVorschlagOffen)) + '</b> → '
         + escapeHtml(postenName(regelVorschlagOffen.kategorieId)) + '?</span>';
    html += '<span class="rv-knoepfe">';
    html += '<button type="button" onclick="regelVorschlagAnnehmen()">Regel anlegen</button>';
    html += '<button type="button" onclick="regelVorschlagVerwerfen()">nein</button>';
    html += '</span></div>';
  }
  html += '<div class="korb-zaehler">' + (gesamt === 1 ? 'Letzter Eintrag' : 'Noch ' + gesamt + ' zu prüfen') + '</div>';

  html += '<div class="korb-karte">';
  html += '<div class="korb-kopf"><span class="k-datum">' + datumLang(b.datum) + '</span>';
  html += '<span class="k-betrag' + (istEinnahme ? ' haben' : '') + '">' + (istEinnahme ? '+' : '−') + euro(Math.abs(b.betrag)) + '</span></div>';
  if (empf) html += '<div class="korb-empf">' + escapeHtml(empf) + '</div>';
  if (zweck) html += '<div class="korb-zweck">' + escapeHtml(zweck.length > 160 ? zweck.slice(0, 160) + '…' : zweck) + '</div>';
  html += '</div>';

  if (istEinnahme) {
    const ePosten = daten.kategorien.filter(k => istEinnahmePosten(k) && !k.archiviert && k.id !== EINNAHME_ID)
      .sort((x, y) => (x.reihenfolge || 0) - (y.reihenfolge || 0) || x.name.localeCompare(y.name, 'de'));
    html += '<div class="korb-abschnitt">Einnahme-Posten wählen — verzeichnet sofort</div>';
    html += '<div class="postenwahl">';
    for (const p of ePosten) {
      html += '<button type="button" class="wahl-posten" onclick="korbEinnahme(\'' + b.id + '\', \'' + p.id + '\')">'
           + '<span class="w-name">' + escapeHtml(p.name) + '</span>'
           + '<span class="w-rest">' + euroOhneZeichen(einnahmeSumme(p.id, blatt)) + ' im Blatt</span></button>';
    }
    html += '<button type="button" class="wahl-posten" onclick="korbEinnahme(\'' + b.id + '\', \'' + EINNAHME_ID + '\')">'
         + '<span class="w-name">Ohne Zuordnung</span><span class="w-rest">Sammelposten</span></button>';
    html += '</div>';
    html += '<div class="korb-abschnitt"><button type="button" class="leise" style="padding:2px 0" onclick="oeffneEinnahmePostenAusKorb()">Einnahme-Posten anlegen</button></div>';
  } else {
    html += '<div class="korb-abschnitt">Beweggrund — freiwillig, ein Tipp</div>';
    html += '<div class="streifen-reihe">';
    for (const g of aktiveBeweggruende()) {
      html += '<button type="button" class="stempel' + (korbBeweggrund === g.id ? ' gewaehlt' : '') + '" onclick="korbWaehleBeweggrund(\'' + b.id + '\', \'' + g.id + '\')">' + escapeHtml(g.name) + '</button>';
    }
    html += '</div>';
    html += '<div class="korb-abschnitt">Posten wählen — verbucht sofort</div>';
    html += '<div class="postenwahl">';
    for (const p of posten) {
      const rest = (p.monatsbudget || 0) - istBetrag(p.id, blatt);
      html += '<button type="button" class="wahl-posten" onclick="korbVerbuche(\'' + b.id + '\', \'' + p.id + '\')">'
           + '<span class="w-name">' + escapeHtml(p.name) + '</span>'
           + '<span class="w-rest' + (rest < 0 ? ' rot' : '') + '">' + (rest < 0 ? 'überzogen um ' + euro(-rest) : 'verbleiben ' + euro(rest)) + '</span>'
           + '</button>';
    }
    html += '<button type="button" class="wahl-posten" onclick="korbVerbuche(\'' + b.id + '\', \'' + ABHEBUNG_ID + '\')">'
         + '<span class="w-name">Bargeldabhebung</span>'
         + '<span class="w-rest">in die Kasse</span></button>';
    html += '</div>';
  }

  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="korbSpaeter(\'' + b.id + '\')">später</button>';
  html += '<button type="button" class="leise" onclick="schliesseKorb()">Schließen</button>';
  html += '</div>';
  if (aktiveRegeln().length > 0 && korbRegeltreffer().length > 0) {
    html += '<div class="korb-fuss"><button type="button" onclick="zeigeKorbNachlauf()">Regeln auf den Korb anwenden</button></div>';
  }
  oeffneZettel(html);
}

/* Regeln nachträglich auf den Korb anwenden (nie still — immer mit Vorschau) */

function korbRegeltreffer() {
  const treffer = [];
  for (const b of korbListe()) {
    const r = findeRegel(b);
    if (!r) continue;
    const ziel = daten.kategorien.find(k => k.id === r.kategorieId);
    const passt = r.kategorieId === ABHEBUNG_ID
      ? b.betrag < 0
      : (b.betrag < 0 ? (!ziel || istAusgabePosten(ziel)) : (ziel && istEinnahmePosten(ziel)));
    if (passt) treffer.push({ buchung: b, regel: r });
  }
  return treffer;
}

function zeigeKorbNachlauf() {
  const treffer = korbRegeltreffer();
  const gesamt = korbListe().length;
  let html = '<div class="zettel-titel">Regeln anwenden</div>';
  if (treffer.length === 0) {
    html += '<p class="vermerk">Keine Regel greift auf den Korb.</p>';
  } else {
    html += '<p class="hinweistext"><b>' + treffer.length + '</b> von ' + gesamt + ' Einträgen im Korb würden zugeordnet:</p>';
    const jePosten = {};
    for (const t of treffer) {
      const name = postenName(t.regel.kategorieId);
      jePosten[name] = (jePosten[name] || 0) + 1;
    }
    html += '<div class="spaltenkopf"><span>Posten</span><span></span><span>Anzahl</span></div>';
    for (const name of Object.keys(jePosten).sort((a, b) => a.localeCompare(b, 'de'))) {
      html += '<div class="einnahme-zeile" style="pointer-events:none"><span class="name">' + escapeHtml(name) + '</span>'
           + '<span class="e-summe">' + jePosten[name] + '</span></div>';
    }
    html += '<p class="hinweistext" style="margin-top:12px">Die Zuordnungen werden als „automatisch" gekennzeichnet und sind jederzeit umbuchbar.</p>';
  }
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneKorb()">Zurück</button>';
  if (treffer.length > 0) {
    html += '<button type="button" class="knopf primaer" onclick="fuehreKorbNachlaufAus()">Zuordnen</button>';
  }
  html += '</div>';
  oeffneZettel(html);
}

function fuehreKorbNachlaufAus() {
  const treffer = korbRegeltreffer();
  for (const t of treffer) {
    t.buchung.kategorieId = t.regel.kategorieId;
    t.buchung.autoZugeordnet = true;
  }
  speichere();
  render();
  zeigeQuittung(treffer.length + (treffer.length === 1 ? ' Eintrag zugeordnet.' : ' Einträge zugeordnet.'));
  oeffneKorb();
}

function korbWaehleBeweggrund(buchungId, beweggrundId) {
  korbBeweggrund = korbBeweggrund === beweggrundId ? null : beweggrundId;
  oeffneKorb();
}

function korbVerbuche(buchungId, kategorieId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  b.kategorieId = kategorieId;
  b.autoZugeordnet = false;
  if (korbBeweggrund && kategorieId !== ABHEBUNG_ID) {
    const g = beweggrund(korbBeweggrund);
    if (g) { b.beweggrundId = g.id; b.geplant = g.geplantStandard; }
  }
  korbBeweggrund = null;
  speichere();

  // Regelvorschlag: nur wenn keine Regel den Text bereits erfasst.
  const v = regelVorschlagFuer(b);
  if (v && !findeRegel(b)) {
    regelVorschlagOffen = { empfaenger: v.empfaenger, zweck: v.zweck, kategorieId: kategorieId };
  } else {
    regelVorschlagOffen = null;
    zeigeQuittung('Verbucht.');
  }
  oeffneKorb();
}

function korbEinnahme(buchungId, kategorieId) {
  const b = daten.buchungen.find(x => x.id === buchungId);
  if (!b) return;
  const ziel = kategorieId || EINNAHME_ID;
  if (ziel === EINNAHME_ID) sichereSammelposten();
  b.kategorieId = ziel;
  korbBeweggrund = null;
  regelVorschlagOffen = null;
  speichere();
  zeigeQuittung('Verzeichnet.');
  oeffneKorb();
}

function oeffneEinnahmePostenAusKorb() {
  let html = '<div class="zettel-titel">Neuer Einnahme-Posten</div>';
  html += '<div class="feldgruppe"><label for="en-name">Bezeichnung</label>';
  html += '<input class="feld" id="en-name" type="text" autocomplete="off" placeholder="z. B. Gehalt"></div>';
  html += '<div class="knopfzeile">';
  html += '<button type="button" class="leise" onclick="oeffneKorb()">Abbrechen</button>';
  html += '<button type="button" class="knopf primaer" onclick="legeEinnahmePostenAnUndZurueck()">Anlegen</button>';
  html += '</div>';
  oeffneZettel(html);
  document.getElementById('en-name').focus();
}

function legeEinnahmePostenAnUndZurueck() {
  const name = document.getElementById('en-name').value.trim();
  if (!name) { document.getElementById('en-name').focus(); return; }
  const maxReihe = daten.kategorien.reduce((m, k) => Math.max(m, k.reihenfolge || 0), 0);
  daten.kategorien.push({
    id: neueId('k'), name: name, typ: 'einnahme', konto: 'giro',
    monatsbudget: 0, reihenfolge: maxReihe + 1, archiviert: false
  });
  speichere();
  zeigeQuittung('Posten angelegt.');
  oeffneKorb();
}

function korbSpaeter(buchungId) {
  korbUebersprungen.add(buchungId);
  korbBeweggrund = null;
  regelVorschlagOffen = null;
  const liste = korbListe();
  if (liste.every(b => korbUebersprungen.has(b.id))) {
    schliesseKorb();
    return;
  }
  oeffneKorb();
}

function schliesseKorb() {
  korbUebersprungen = new Set();
  korbBeweggrund = null;
  regelVorschlagOffen = null;
  schliesseZettel();
  render();
}

/* ── Blattwahl ── */

function oeffneBlattwahl() {
  const blaetter = alleBlaetter();
  let html = '<div class="zettel-titel">Blätter</div>';
  for (const bl of blaetter) {
    const z = blattZahlen(bl);
    const aktuell = bl === aktuellesBlatt();
    html += '<button type="button" class="blattzeile' + (aktuell ? ' aktuell' : '') + '" onclick="waehleBlatt(\'' + bl + '\')">';
    html += '<span class="b-name">' + escapeHtml(blattNameLang(bl)) + '</span>';
    html += '<span class="b-summe">Ausgaben ' + euro(z.ist) + '</span>';
    html += '</button>';
  }
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="schliesseZettel()">Schließen</button></div>';
  oeffneZettel(html);
}

let blattManuellGewaehlt = false;

function waehleBlatt(blatt) {
  angezeigtesBlatt = blatt;
  blattManuellGewaehlt = blatt !== aktuellesBlatt();
  schliesseZettel();
  render();
}

/* ── Sicherung ── */

function oeffneSicherung() {
  let html = '<div class="zettel-titel">Sicherung</div>';
  const ls = daten.settings.letzteSicherung;
  html += '<p class="hinweistext">Der gesamte Bestand wird als eine Datei gesichert und kann daraus vollständig wiederhergestellt werden. '
       + (ls ? 'Letzte Sicherung: <b>' + datumLang(ls.slice(0, 10)) + '</b>.' : 'Noch keine Sicherung verzeichnet.') + '</p>';
  html += '<div class="knopfzeile" style="justify-content:center;margin-top:6px">';
  html += '<button type="button" class="knopf primaer" onclick="exportiereSicherung()">Sicherung exportieren</button>';
  html += '</div>';
  html += '<div class="buchtitel" style="margin-top:22px">Wiederherstellen</div>';
  html += '<p class="hinweistext">Eine Sicherungsdatei wählen. Vor dem Ersetzen wird eine Vorschau gezeigt — nichts geschieht ohne Bestätigung.</p>';
  html += '<div class="knopfzeile" style="justify-content:center;margin-top:0">';
  html += '<label class="knopf" style="display:inline-block">Datei wählen'
       + '<input type="file" id="import-datei" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;overflow:hidden" onchange="pruefeImport(this)"></label>';
  html += '</div>';
  html += '<div id="import-vorschau"></div>';
  html += '<p class="vermerk" style="text-align:center;margin-top:24px">Fassung ' + FASSUNG + ' · Datenschema ' + SCHEMA_VERSION + '</p>';
  html += '<div class="knopfzeile"><button type="button" class="leise" onclick="schliesseZettel()">Schließen</button></div>';
  oeffneZettel(html);
}

function exportiereSicherung() {
  daten.settings.letzteSicherung = new Date().toISOString().slice(0, 19);
  speichere();
  const inhalt = JSON.stringify(daten, null, 2);
  const blob = new Blob([inhalt], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'finanz-cockpit-sicherung-' + heuteISO() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  zeigeQuittung('Sicherung erstellt.');
  oeffneSicherung();
}

let importKandidat = null;

function pruefeImport(input) {
  const datei = input.files && input.files[0];
  const vorschau = document.getElementById('import-vorschau');
  importKandidat = null;
  if (!datei) return;
  const leser = new FileReader();
  leser.onload = () => {
    let d;
    try {
      d = JSON.parse(leser.result);
    } catch (e) {
      vorschau.innerHTML = '<p class="hinweistext" style="color:var(--siegellack)">Die Datei ließ sich nicht lesen — keine gültige Sicherung.</p>';
      return;
    }
    if (!d || typeof d.schemaVersion !== 'number' || !Array.isArray(d.kategorien) || !Array.isArray(d.buchungen)) {
      vorschau.innerHTML = '<p class="hinweistext" style="color:var(--siegellack)">Die Datei enthält keinen Finanz-Cockpit-Bestand.</p>';
      return;
    }
    if (d.schemaVersion > SCHEMA_VERSION) {
      vorschau.innerHTML = '<p class="hinweistext" style="color:var(--siegellack)">Die Sicherung stammt aus einer neueren Fassung (Schema ' + d.schemaVersion + ') und kann hier nicht eingelesen werden.</p>';
      return;
    }
    importKandidat = migriere(d);
    const ls = importKandidat.settings.letzteSicherung;
    vorschau.innerHTML =
      '<p class="hinweistext">Vorschau: <b>' + importKandidat.kategorien.length + '</b> Posten, <b>'
      + importKandidat.buchungen.length + '</b> Einträge'
      + (ls ? ', gesichert am <b>' + datumLang(ls.slice(0, 10)) + '</b>' : '')
      + '. Der jetzige Bestand (<b>' + daten.kategorien.length + '</b> Posten, <b>' + daten.buchungen.length + '</b> Einträge) wird dabei vollständig ersetzt.</p>'
      + '<div class="knopfzeile" style="justify-content:center"><button type="button" class="knopf rot" onclick="fuehreImportAus()">Bestand ersetzen</button></div>';
  };
  leser.readAsText(datei);
}

function fuehreImportAus() {
  if (!importKandidat) return;
  daten = importKandidat;
  importKandidat = null;
  speichere();
  angezeigtesBlatt = aktuellesBlatt();
  schliesseZettel();
  render();
  zeigeQuittung('Bestand wiederhergestellt.');
}

/* ════════════════ Start ════════════════ */

document.getElementById('siegel').addEventListener('click', oeffneEintrag);

// Beim Zurückkehren zur App (neuer Tag / neuer Monat) Ansicht auffrischen.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    if (angezeigtesBlatt !== aktuellesBlatt() && !blattManuellGewaehlt) {
      angezeigtesBlatt = aktuellesBlatt();
    }
    render();
  }
});

render();
</script>
